# skip-job 패턴의 `changes` 잡 — 세 워크플로가 공유하는 reusable workflow.
#
# ## 왜 추출했나
#
# `#1106` 이 required status check 데드락을 풀면서 도입한 패턴이다: `paths:` 필터를 걷어
# **잡은 항상 돌리고**, 이 잡이 관련성을 판정해 무관하면 각 잡의 **스텝만** 건너뛴다.
# 그 wiring(checkout `fetch-depth: 0` + SHA env 4개 + 판정 스크립트 호출)이 전환할 때마다
# 그대로 복제돼 `deps-security-checks`·`frontend-checks`·`backend-checks` 셋에 같은 20여 줄이
# 세 번 들어갔다. `#1106` 이 "**3번째 전환 시점**에 추출" 을 트리거로 확정했고
# `backend-checks.yml`(`#1109`)이 그 세 번째였다.
#
# 2개 시점에 추상화하지 않은 이유도 그 결정에 적혀 있다 — 아직 안 드러난 변형을 추측으로
# 설계하게 된다. 셋을 보고 나서 확인한 변형은 **pathspec 목록 하나뿐**이라 입력도 그것뿐이다.
#
# ## pathspec 을 여러 줄 문자열로 받는 이유
#
# `workflow_call` 의 `inputs` 는 스칼라(string/number/boolean)만 받는다 — 배열을 못 넘긴다.
# 그래서 **한 줄에 하나씩** 받아 호출부에서 배열로 되돌린다.
#
# > **여기가 이 파일에서 가장 조용히 깨지기 쉬운 자리다.** 문자열을 그대로
# > `scripts/ci-paths-changed.sh $PATHSPECS` 로 넘기면 **글로브가 cwd 기준으로 조기
# > 확장**된다 — `scripts/*` 가 실재 파일 경로로 바뀌어 원래 판정하려던 pathspec 이
# > 사라지고, 스크립트는 "그런 경로 변경 없음" 으로 답한다. 세 워크플로의 모든 검사가
# > 조용히 no-op 되고 required check 는 초록이다. 이 패턴이 막으려던 것 그 자체다.
# >
# > 처음엔 "전부가 한 덩어리 인자 1개가 된다" 고 적었는데 **뮤테이션으로 반증됐다** —
# > bash 는 IFS 에 개행이 있어 인자 수는 맞게 갈린다. 실제로 깨지는 것은 **글로브 확장**
# > (과 공백 포함 pathspec)이다. 받는 쪽이 실제로 무엇을 봤는지는
# > `.claude/tests/test_changed_paths_reusable.py` 가 스텁으로 고정한다.

name: _changed-paths

on:
  workflow_call:
    inputs:
      pathspecs:
        description: >-
          git pathspec 목록 — **한 줄에 하나**. 호출부에서 YAML 블록 스칼라(`|`)로 넘긴다.
          따옴표는 붙이지 않는다(셸을 거치지 않고 배열 원소로 그대로 들어간다).
        required: true
        type: string
    outputs:
      relevant:
        description: >-
          `'true'` = 관련 변경 있음(실제 검사 수행) · `'false'` = 없음(스텝 no-op).
          호출부는 `!= 'false'` 로 게이팅한다 — 빈 값일 때 **검사를 돌리는** 쪽이 fail-safe 다.
        value: ${{ jobs.detect.outputs.relevant }}

jobs:
  detect:
    name: 변경 경로 판정
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          # merge-base 계산에 필요 — 얕은 클론이면 스크립트가 fail-safe(true)로 떨어진다.
          fetch-depth: 0
      - id: detect
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # push 에도 실제 diff 를 넘긴다 — 안 넘기면 main 으로의 모든 push 가
          # fail-safe 로 전체 잡을 돌려 목적 범위를 넘는 광역화가 된다.
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
          # `${{ }}` 를 `run:` 문자열에 직접 끼워 넣지 않는다(스크립트 인젝션 회피) —
          # env 로 넘겨 셸이 값을 코드로 읽지 않게 한다.
          PATHSPECS: ${{ inputs.pathspecs }}
        run: |
          set -euo pipefail
          # 한 줄 = 인자 하나. `mapfile` 을 쓰지 않는다 — bash 4+ 전용이라
          # 러너 이미지가 바뀌거나 로컬에서 이 블록을 재현할 때 `command not found` 로
          # 죽는다(실측: macOS 기본 bash 3.2). `read` 루프는 어디서나 돈다.
          #
          # 빈 줄은 버린다 — 빈 문자열 인자는 git pathspec 에서 **모든 경로**를 뜻해
          # 판정을 항상 true 로 만든다(게이팅이 사라진다). 블록 스칼라는 끝에 개행이
          # 남으므로 실제로 도달하는 입력이다.
          #
          # `if` 로 쓴 것도 의도다 — `[[ … ]] && arr+=(…)` 를 루프 본문의 마지막
          # 명령으로 두면 조건이 거짓일 때 그 목록이 1 을 반환해 `set -e` 가 스크립트를
          # 통째로 끝낸다(빈 줄 하나에 판정이 죽는다).
          # `IFS=` 를 **일부러 빼서** `read` 가 앞뒤 공백을 떼게 한다.
          #
          # 이유: 하네스 가드(`test_required_check_skip_jobs.py::pathspecs_of`)가 YAML 을
          # 읽을 때 `line.strip()` 으로 정규화한다. 런타임이 안 떼면 두 쪽 판정이 갈려서,
          # `pathspecs:` 항목에 공백이 하나 섞이는 순간 **가드는 통과하는데 런타임에서는
          # 그 pathspec 이 조용히 무력화**된다 — 이 PR 이 통째로 막으려는 클래스다
          # (ai-review 19_26_54 WARNING). 항목 앞뒤 공백은 언제나 오타이지 의도가 아니다.
          #
          # 변수 하나만 주면 `read` 는 줄을 쪼개지 않고 앞뒤 IFS 공백만 뗀다 — pathspec
          # **안쪽** 공백(`path with space.yaml`)은 그대로 살아남는다(테스트로 고정).
          FILTERED=()
          while read -r spec; do
            if [ -n "$(printf '%s' "$spec" | tr -d '[:space:]')" ]; then
              FILTERED+=("$spec")
            fi
          done <<< "$PATHSPECS"
          if [ "${#FILTERED[@]}" -eq 0 ]; then
            echo "pathspecs 입력이 비었다 — 판정 대상이 없다(fail-closed)." >&2
            exit 2
          fi
          echo "판정 대상 pathspec ${#FILTERED[@]}개:"
          printf '  - %s\n' "${FILTERED[@]}"
          scripts/ci-paths-changed.sh "${FILTERED[@]}"
