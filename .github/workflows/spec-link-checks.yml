# `codebase/frontend/src/lib/docs/__tests__/` 의 **docs 가드 전체**를, 그 가드들이 스캔하는
# 데이터(codebase 소스 · `spec/**` · 거버넌스 문서)가 바뀔 때마다 돌린다.
# (2026-09-24 전까지는 spec-link-integrity 가드 하나만 — codebase 주석·spec·거버넌스 문서의
#  spec 상대링크 부패 — 돌았다. 확장 경위는 아래 2026-09-24 문단.)
#
# 도입 배경: 가드는 `codebase/frontend/src/lib/docs/__tests__/` 의 vitest 로 도는데,
# `frontend-checks.yml` 은 `codebase/frontend/**`·`codebase/packages/**` 만 trigger 한다.
# 그런데 이 가드가 스캔하는 영역은 `codebase/{backend,frontend,channel-web-chat,packages}`
# 전부다(NERV `CLE-ENG-SPECEVIDENCE`). 즉 backend/channel-web-chat 소스만 바꾼 PR 은
# 가드가 스캔하는 바로 그 영역인데도 CI 에서 가드가 안 돌던 갭이 있었다(PR #912 후속).
#
# frontend-checks 는 `next build`(무거움)까지 도므로 backend 변경마다 태우면 낭비다.
# 본 workflow 는 docs 가드 vitest 만 도는 lightweight 대체 트리거다(`next build`·lint·typecheck
# 없음 — 디렉터리 전체도 수 초다).
# (harness `unit` stage 는 무조건 frontend test 를 돌리므로 로컬/harness 는 이미 커버 —
#  본 workflow 는 CI PR-trigger 갭만 메운다.)
#
# 2026-08-27: 가드에 **scope 3(거버넌스 문서 — 루트 `*.md` + `.claude/**`)** 가 붙으면서
# 같은 갭이 그대로 재현될 뻔했다 — 스코프만 넓히고 `pathspecs` 를 안 늘리면 `CLAUDE.md` 를
# 고쳐도 CI 에서 가드가 안 돈다. 아래 목록에 두 경로를 함께 등재한 이유다.
#
# 2026-09-24: **같은 갭의 셋째 판** — 이번엔 가드가 아니라 **가드 목록**이 좁았다.
# `src/lib/docs/__tests__/` 에는 `plan/**`·`spec/**` 을 스캔하는 가드가 여럿 있는데
# (`plan-frontmatter` · `spec-frontmatter` · `spec-code-paths` · `spec-pending-plan-existence` ·
# `spec-status-lifecycle` …) 여기서는 `spec-link-integrity` **하나만** 돌았고, pathspec 에는
# `plan/**` 도 없었다. 그래서 plan/spec 만 바꾼 PR — 그 가드들이 막으려는 위반이 가장 잘 생기는
# PR — 에서 가드가 하나도 안 돌았다. 실제로 plan frontmatter 위반을 섞은 PR 이 로컬에서만
# 잡혔다(`#1387` 1라운드 Critical).
#
# 그래서 **파일을 열거하지 않고 디렉터리째** 돌린다. 열거하면 새 docs 가드가 생길 때마다
# 여기를 고치는 것을 잊는다 — 이 파일이 두 번 겪은 형태다. 디렉터리 전체도 vitest 로 수 초라
# 「가벼운 대체 트리거」 라는 이 워크플로의 목적은 그대로다(`next build`·lint·typecheck 없음).
#
# 2026-10-01: pathspec 에서 `plan/**` 를 뺐다(NERV 정본 전환 단계 3, Task `CLE-T-FN2JWK`). `plan/` 과
# 그것을 읽던 plan 가드(`plan-frontmatter` · `spec-pending-plan-existence` · `spec-plan-completion` ·
# `spec-status-lifecycle`)를 같은 PR 에서 지웠다. 작업 추적은 NERV Task 다.
#
# 2026-09-29: 잡 `spec-mirror-integrity` 를 더했다(NERV 정본 전환 단계 1). docs 가드와 같은
# 경로 판정(`changes`)을 쓴다. 판정을 따로 두면 `spec/**` 와 `.claude/tools/nerv-mirror/**` 를
# 목록 두 벌에 맞춰 적어야 하는데, 잡이 1초 안에 끝나 넓게 도는 쪽이 싸다.
#
# 2026-10-03: 옛 스펙 트리를 지우며 그 트리를 보던 가드(`spec-frontmatter` · `spec-area-index` ·
# `spec-code-paths`)를 걷고 `spec-impl-locations` 를 더했다(NERV 정본 전환 단계 5, Task
# `CLE-T-7M4C4X`). 위 2026-09-24 문단의 가드 이름은 그때 기준이다. 새 가드가 구현 위치로 읽는 루트에
# `scripts/` · `.github/` 가 있어 pathspec 에 두 루트를 통째로 더했다(같은 갭의 넷째 판).

name: spec-link-checks

# **`paths:` 필터가 없다 — 의도적이다** (required status check 등록을 위해).
# 근거·메커니즘은 `scripts/ci-paths-changed.sh` 헤더 주석 참조.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: spec-link-checks-${{ github.ref }}
  cancel-in-progress: true

# 이 워크플로는 읽기만 한다 — checkout 과 검사 실행뿐이다. 명시하지 않으면 저장소 기본
# 토큰 권한을 상속하는데, 그 기본값은 저장소 설정에 달려 있어 이 파일만 봐서는 알 수 없다.
#
# **일괄로 바르면 안 된다**: `migration-recheck-on-main.yml` 은 `gh pr comment` 때문에
# `pull-requests: write` 가 필요하다. 그래서 "모두 contents: read" 가 아니라
# **워크플로마다 필요한 값을 선언**하는 것이 규칙이고, `test_workflow_yaml_structure.py`
# 의 `_PERMISSIONS` 등록부가 그것을 강제한다.
permissions:
  contents: read

jobs:
  # 종전 `on.*.paths` 목록이 여기 한 곳에만 산다. wiring 은 `_changed-paths.yml` 공유.
  #
  # `scripts/ci-paths-changed.sh` 와 `_changed-paths.yml` 자신도 목록에 있다 — 판정 로직·wiring
  # 이 바뀌면 그것에 기대는 이 워크플로가 돌아야 한다(이 저장소가 여섯 번 겪은 paths 커버리지 갭).
  changes:
    name: 변경 경로 판정
    uses: ./.github/workflows/_changed-paths.yml
    with:
      pathspecs: |
        codebase/backend/**
        codebase/frontend/**
        codebase/channel-web-chat/**
        codebase/packages/**
        spec/**
        # API 카탈로그. `codebase/` 전체를 훑는 가드(옛 경로 래칫 · 키 실재 · 리뷰 인용 형식)가
        # 이 디렉터리의 파일도 읽는다(`.claude/tests/test_api_catalog_ci_coverage.py`).
        codebase/api-catalogs/**
        # 거버넌스 문서 (2026-08-27 추가) — 가드 scope 3.
        # `:(glob)` 매직이 없으면 git pathspec 의 `*` 가 `/` 를 넘어 **17,202개**(당시 spec·plan·
        # review 전부)를 잡았다(실측). 루트 레벨 `*.md` 만 잡으려면 이 매직이 필수다.
        :(glob)*.md
        .claude/**
        # `spec-impl-locations` 가 구현 위치로 읽는 루트 넷(`codebase/` · `.claude/` · `.github/` ·
        # `scripts/`) 전부. 미러가 인용한 `scripts/*` · `.github/workflows/*` 만 옮기는 PR 에서도
        # 가드가 돌아야 한다(전환 단계 5). 이 둘은 판정 로직(`scripts/ci-paths-changed.sh` ·
        # `_changed-paths.yml`), 공유 셋업 액션, 이 워크플로 자신도 덮는다. 그 셋은 바뀌면 그것에
        # 기대는 이 워크플로가 돌아야 해서 따로 등재해 왔다.
        # `.claude/tests/test_spec_link_checks_scope.py` 가 루트 넷의 추적 파일이 모두 덮이는지 본다.
        scripts/**
        .github/**

  # **잡 이름은 `spec-link-integrity` 그대로 둔다** — 2026-09-24 부터는 그 가드 하나가 아니라
  # `src/lib/docs/__tests__/` 전체를 돌지만, 이름은 required status check 의 앵커로 설계됐다
  # (`#1106`, `test_workflow_yaml_structure.py` 가 고정). **지금은 등록된 required check 가
  # 없다**(2026-09-24 실측 — branch protection·ruleset 모두 없음). 다만 등록되는 순간부터는
  # 이름을 바꾸면 그 check 가 영원히 보고되지 않아 머지가 교착된다 — 그래서 미리 바꾸지 않는다.
  spec-link-integrity:
    needs: changes
    # `changes` 가 실패/오류여도 이 잡은 돈다 — needs 실패로 skipped 되면
    # 'skipped 가 required check 를 만족하는가' 라는 모호함이 다른 경로로 재발한다.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 무관한 변경 — 검사 생략 (체크는 통과로 보고)
        if: needs.changes.outputs.relevant == 'false'
        run: echo "codebase 소스·spec·거버넌스 문서 경로 변경 없음 — 이 잡은 no-op 으로 통과한다."

      - uses: actions/checkout@v7
        if: needs.changes.outputs.relevant != 'false'

      # 가드는 frontend 패키지의 vitest 로 돈다. 스캔 대상(backend 등) 소스는
      # checkout 으로 전체 트리가 존재하므로 fs 스캔에 문제 없다.
      - uses: ./.github/actions/pnpm-workspace
        if: needs.changes.outputs.relevant != 'false'
        with:
          filter: 'frontend...'

      # 디렉터리째 — 파일을 열거하면 새 docs 가드가 생길 때 여기를 잊는다(위 헤더 2026-09-24).
      - name: docs guards (src/lib/docs/__tests__ 전체)
        if: needs.changes.outputs.relevant != 'false'
        run: pnpm --filter frontend test src/lib/docs/__tests__/

  # NERV 스펙 미러 무결성 (NERV 정본 전환 단계 1). `spec/CLE-*` 는 NERV 스펙의 사본이라 손으로
  # 고치지 않는다. 도구 편집은 `.claude/hooks/guard_nerv_owned_paths.py` 가 막고, 그 훅이 보지
  # 못하는 셸 · 손 편집은 여기서 `pull.py --check` 로 잡는다. 무엇을 잡고 무엇을 못 잡는지는
  # `pull.py` 모듈 docstring 의 "보장 범위" 가 정본이다(여기에 다시 적지 않는다). 지문은 같은
  # 파일 안의 값이라 실수를 잡는 장치이지 변조 방지가 아니다(PR 이 넣은 `pull.py` 로 돈다).
  # 네트워크와 토큰 없이 돌고 표준 라이브러리만 쓴다. 위 docs 가드는 미러 본문의 링크를 검사하지
  # 않는다. 미러의 링크는 `pull.py` 가 고쳐 쓰고 `--check` 가 이동한 문서를 가리키는 링크를 잡는다.
  spec-mirror-integrity:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 무관한 변경 — 검사 생략 (체크는 통과로 보고)
        if: needs.changes.outputs.relevant == 'false'
        run: echo "이 워크플로의 대상 경로(codebase · spec · 거버넌스 문서) 변경 없음 — 이 잡은 no-op 으로 통과한다."

      # 이 잡이 읽는 것은 `spec/` 과 도구 하나다. 저장소 전체를 받지 않는다(단계 3 전에는 추적 파일
      # 약 3.3만 개, 대부분 `review/` 였다). `--check` 는 표준 라이브러리만 쓴다.
      - uses: actions/checkout@v7
        if: needs.changes.outputs.relevant != 'false'
        with:
          sparse-checkout: |
            spec
            .claude/tools/nerv-mirror

      # 러너 기본 python3 도 되지만 다른 워크플로처럼 명시적으로 맞춘다.
      - uses: actions/setup-python@v7
        if: needs.changes.outputs.relevant != 'false'
        with:
          python-version: '3.x'

      - name: spec mirror integrity (pull.py --check)
        if: needs.changes.outputs.relevant != 'false'
        run: python3 .claude/tools/nerv-mirror/pull.py --check
