# 리뷰 커버리지 게이트의 훅-독립 백스톱.
#
# 로컬 `guard_review_before_push` 는 Bash 명령이 `git push` 인지 정규식으로 판정한다.
# 그 정규식이 push 를 놓치면 게이트는 조용히 skip 되고, **놓쳤다는 사실 자체를 인지할
# 주체가 없다** — fail-open 배너조차 push 로 판정돼야 찍힌다. 그래서 사후 탐지를 훅 안에
# 두면 같은 판정자에 의존해 같은 구멍으로 샌다.
#
# 이 워크플로는 GitHub 이 PR 이벤트로 띄우므로 그 정규식을 공유하지 않는다. 그것이 이 층의
# 전부다. 판정 자체는 로컬 훅과 **같은** `review_guard.evaluate_review()` 를 호출한다 —
# 두 번째 구현을 두면 로컬과 CI 가 갈리고, 그 drift 는 이 저장소가 이미 두 번 겪었다.
#
# NERV 정본 전환 단계 2(NERV Task `CLE-T-4ABTG7`)부터 판정 근거는 저장소 `review/**` 파일이
# 아니라 NERV 리뷰 라운드(N1 `gates/reviews/check`)다. 그래서 이 잡은 NERV 를 **읽기만** 하는
# 토큰이 필요하다 — secret `NERV_CI_TOKEN`(읽기 전용) · 저장소 변수 `NERV_SERVER`. 둘 중 하나라도
# 없으면 `--enforce` 에서 실패한다(설정이 빠진 백스톱은 초록인 채로 영원히 꺼지기 때문이다).
# NERV 장애 같은 일시적 판정 불가는 fail-open 이다. 규칙: `scripts/check-review-gate.py` docstring.
#
# **enforce 모드다** — 아래 `run:` 이 `--enforce` 를 넘기고, 위반이면 exit 1 로 PR 을 막는다.
# `#1097`(`cdf3b6832`, 2026-08-07)이 관측 모드에서 전환했다.
#
# 체크아웃은 PR 의 **head 커밋**이다. 기본값(merge 커밋)으로 두면 라운드 이후 커밋을 셀 때 기준
# 브랜치의 커밋이 섞인다. NERV 라운드는 PR 의 head 브랜치 이름으로 찾는다.
#
# 되돌리려면 `run:` 의 `--enforce` 를 빼는 것만으로는 안 된다 —
# `test_review_gate_ci.py::test_the_expectation_still_describes_a_gate_that_runs` 의
# `assertIn("--enforce", ...)` 가 **꺼지는 쪽**을 막고 있어 그 단언부터 마주치게 된다.

name: review-gate

on:
  pull_request:
    paths:
      - 'codebase/**'
      # 게이트 자신과 그것이 읽는 판정 로직이 바뀌면 이 워크플로도 돌아야 한다 —
      # harness-checks.yml 이 같은 실패 클래스를 여섯 번 겪고 세운 규칙.
      # 개별 파일명이 아니라 글롭이다. _lib 에 모듈이 늘면 같은 갭이 반복될 자리다.
      - '.claude/hooks/_lib/**'
      - '.claude/_shared/**'
      # 게이트가 NERV 를 읽는 클라이언트(`Nerv`)가 여기 있다.
      - '.claude/tools/nerv-mirror/pull.py'
      # 강제 리뷰어 규칙과 리뷰어 토글. 게이트의 판정 2b 가 읽는다(전환 4e).
      - '.claude/skills/code-review-agents/lib/router_safety.py'
      - '.claude.project.json'
      - 'scripts/check-review-gate.py'
      - '.github/workflows/review-gate.yml'

concurrency:
  group: review-gate-${{ github.ref }}
  cancel-in-progress: true

# 이 워크플로는 읽기만 한다.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 봇 PR 은 로컬 훅도 리뷰 흐름도 거치지 않는다. 예외를 두지 않으면 이 워크플로는 사실상
    # dependabot 전용 알람이 된다(전환 전 실측: 미커버 80건 중 11건이 dependabot). dependabot
    # PR 에는 secret 도 전달되지 않는다.
    if: github.actor != 'dependabot[bot]'
    steps:
      # 게이트는 기준 브랜치와의 merge-base 와 라운드 이후 커밋을 git 으로 센다 — 전체 히스토리가
      # 필요하다.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # `${{ }}` 를 셸 명령에 직접 보간하지 않는다 — env 경유가 GH Actions 의
      # expression-injection 방어 관행이다(브랜치 이름은 PR 작성자가 정한다).
      - name: Fetch base ref
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "$BASE_REF"

      # 표준 라이브러리 + curl 만 쓴다 (harness 규약) — 설치 단계 없음.
      #
      # `env -i` 로 빈 환경에서 시작해 아래 변수만 넘긴다(전환 4e). 게이트와 그것이 위임하는 코드는
      # 어떤 문법으로 환경을 읽든 CI 에만 있는 변수(`GITHUB_*` · `CI` · `RUNNER_*`)를 볼 수 없다.
      # 그래서 "CI 에서만 다른 판정" 은 환경 변수로는 만들 수 없다. 넘기는 PATH · HOME 의 값이
      # 로컬과 다르다는 사실까지 지우지는 못한다. LD_LIBRARY_PATH 는 setup-python 이 준 python 이
      # 공유 라이브러리를 찾는 데 쓴다. NERV_PROJECT 는 넘기지 않으므로 게이트는 기본값 `clemvion` 을
      # 쓴다(`pull.load_env`). 다른 프로젝트를 볼 일이 생기면 여기에 함께 넘긴다.
      - name: Review coverage backstop
        env:
          NERV_SERVER: ${{ vars.NERV_SERVER }}
          NERV_TOKEN: ${{ secrets.NERV_CI_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: env -i LANG=C.UTF-8 PATH="$PATH" HOME="$HOME" LD_LIBRARY_PATH="$LD_LIBRARY_PATH" NERV_SERVER="$NERV_SERVER" NERV_TOKEN="$NERV_TOKEN" python3 scripts/check-review-gate.py --enforce --branch "$HEAD_REF" --head "$HEAD_SHA" --base "origin/$BASE_REF"
