# Web-chat 위젯 SPA(channel-web-chat) + SDK(packages/web-chat-sdk) 단위 테스트 + build 가드.
#
# 두 패키지는 backend/frontend 의 workspace 의존 그래프에 묶이지 않은 독립 패키지라
# frontend-checks.yml 의 설치 흐름이 커버하지 못한다. 본 워크플로가 각 패키지를
# pnpm --filter 로 독립 설치하고 lint/unit/build 를 실행해 회귀를 조기 차단한다.
# (e2e.yml 과 분리 — 두 패키지만 변할 때 빠르게 fail 하도록.)

name: web-chat-checks

# **`paths:` 필터가 없다 — 의도적이다** (required status check 등록을 위해).
# 근거·메커니즘은 `scripts/ci-paths-changed.sh` 헤더 주석 참조.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: web-chat-checks-${{ github.ref }}
  cancel-in-progress: true

# 이 워크플로는 읽기만 한다 — checkout 과 검사 실행뿐이다. 명시하지 않으면 저장소 기본
# 토큰 권한을 상속하는데, 그 기본값은 저장소 설정에 달려 있어 이 파일만 봐서는 알 수 없다.
#
# **일괄로 바르면 안 된다**: `migration-recheck-on-main.yml` 은 `gh pr comment` 때문에
# `pull-requests: write` 가 필요하다. 그래서 "모두 contents: read" 가 아니라
# **워크플로마다 필요한 값을 선언**하는 것이 규칙이고, `test_workflow_yaml_structure.py`
# 의 `_PERMISSIONS` 등록부가 그것을 강제한다.
permissions:
  contents: read

jobs:
  # 종전 `on.*.paths` 목록이 여기 한 곳에만 산다. wiring 은 `_changed-paths.yml` 공유.
  #
  # `scripts/ci-paths-changed.sh` 와 `_changed-paths.yml` 자신도 목록에 있다 — 판정 로직·wiring
  # 이 바뀌면 그것에 기대는 이 워크플로가 돌아야 한다(이 저장소가 여섯 번 겪은 paths 커버리지 갭).
  changes:
    name: 변경 경로 판정
    uses: ./.github/workflows/_changed-paths.yml
    with:
      pathspecs: |
        codebase/channel-web-chat/**
        codebase/packages/web-chat-sdk/**
        codebase/packages/sdk/**
        pnpm-lock.yaml
        pnpm-workspace.yaml
        scripts/ci-paths-changed.sh
        .github/workflows/_changed-paths.yml
        # 공유 셋업 액션. `_changed-paths.yml` 을 등재한 것과 **같은 이유**다 —
        # 이 액션이 바뀌면 그것에 기대는 이 워크플로가 돌아야 한다. 추출로 새로
        # 생긴 의존이라 등재를 빠뜨리기 쉬운 자리다.
        .github/actions/pnpm-workspace/action.yml
        .github/workflows/web-chat-checks.yml

  sdk:
    # 패키지 dir 은 packages/web-chat-sdk 이지만 package name 은 @workflow/web-chat.
    name: web-chat-sdk (lint/test/build)
    needs: changes
    # `changes` 가 실패/오류여도 이 잡은 돈다 — needs 실패로 skipped 되면
    # 'skipped 가 required check 를 만족하는가' 라는 모호함이 다른 경로로 재발한다.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 무관한 변경 — 검사 생략 (체크는 통과로 보고)
        if: needs.changes.outputs.relevant == 'false'
        run: echo "web-chat/SDK 관련 경로 변경 없음 — 이 잡은 no-op 으로 통과한다."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.relevant != 'false'
      - uses: ./.github/actions/pnpm-workspace
        if: needs.changes.outputs.relevant != 'false'
        with:
          filter: '@workflow/web-chat...'
      - name: Lint
        if: needs.changes.outputs.relevant != 'false'
        run: pnpm --filter @workflow/web-chat lint
      - name: Typecheck
        if: needs.changes.outputs.relevant != 'false'
        run: pnpm --filter @workflow/web-chat typecheck
      - name: Jest (unit)
        if: needs.changes.outputs.relevant != 'false'
        run: pnpm --filter @workflow/web-chat test
      - name: Build (tsc + loader IIFE)
        if: needs.changes.outputs.relevant != 'false'
        run: pnpm --filter @workflow/web-chat build

  widget:
    name: channel-web-chat (lint/test/build)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 무관한 변경 — 검사 생략 (체크는 통과로 보고)
        if: needs.changes.outputs.relevant == 'false'
        run: echo "web-chat/SDK 관련 경로 변경 없음 — 이 잡은 no-op 으로 통과한다."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.relevant != 'false'
      - uses: ./.github/actions/pnpm-workspace
        if: needs.changes.outputs.relevant != 'false'
        with:
          filter: 'channel-web-chat...'
      - name: Lint
        if: needs.changes.outputs.relevant != 'false'
        run: pnpm --filter channel-web-chat lint
      # 타입 가드(위젯 eia-events.test.ts 의 @ts-expect-error negative·WaitingContext
      # 캐스트-free 컴파일)는 이 step 이 담당한다 — vitest 는 esbuild 로 타입을 strip 하고,
      # 아래 next build 는 앱 module graph 만 걸어 standalone *.test.ts 를 typecheck 하지 않는다.
      - name: Typecheck
        if: needs.changes.outputs.relevant != 'false'
        run: pnpm --filter channel-web-chat typecheck
      - name: Vitest (unit)
        if: needs.changes.outputs.relevant != 'false'
        run: pnpm --filter channel-web-chat test
      # next build (static export) — 위젯 SPA prerender 검증(타입 검증은 위 Typecheck step).
      - name: Next build (static export)
        if: needs.changes.outputs.relevant != 'false'
        run: pnpm --filter channel-web-chat build

  sdk-client:
    # packages/sdk (@workflow/sdk) — EIA client SDK. web-chat-checks 판정 pathspec 에
    # packages/sdk/** 가 있으나 이를 도는 job 이 없던 갭을 메운다(PR #912 후속).
    name: '@workflow/sdk (test/build)'
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 무관한 변경 — 검사 생략 (체크는 통과로 보고)
        if: needs.changes.outputs.relevant == 'false'
        run: echo "web-chat/SDK 관련 경로 변경 없음 — 이 잡은 no-op 으로 통과한다."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.relevant != 'false'
      - uses: ./.github/actions/pnpm-workspace
        if: needs.changes.outputs.relevant != 'false'
        with:
          filter: '@workflow/sdk...'
      # test(ts-jest)가 타입 가드(client.spec.ts 의 @ts-expect-error negative)를 검증한다 —
      # build(tsc)는 tsconfig 가 *.spec.ts 를 exclude 하므로 spec 을 안 본다.
      - name: Lint
        if: needs.changes.outputs.relevant != 'false'
        run: pnpm --filter @workflow/sdk lint
      - name: Jest (unit + type guard)
        if: needs.changes.outputs.relevant != 'false'
        run: pnpm --filter @workflow/sdk test
      - name: Build (tsc)
        if: needs.changes.outputs.relevant != 'false'
        run: pnpm --filter @workflow/sdk build
