# Frontend 단위 테스트 + production build 가드.
#
# 도입 배경: 2026-05 Callout MDX `type="info"` 미정의 값이 `next dev` 에서만
# 발현되어 production prerender 단계에서 진작 잡혔어야 할 버그가 사용자 환경에서
# runtime crash 로 드러난 사건. 본 워크플로는 PR 단계에서 `pnpm build` 를
# 실제로 돌려 `generateStaticParams` 가 만드는 모든 docs 라우트를 prerender 하고
# vitest unit 테스트도 함께 실행해 회귀를 조기 차단한다.
#
# e2e.yml (docker compose) 와 분리한 이유: e2e 는 backend image 빌드부터 도는
# 무거운 흐름이라 PR feedback loop 가 길다. 본 워크플로는 frontend 디렉터리만
# 변할 때 빠르게 fail 하도록 분리한다.

name: frontend-checks

# **`paths:` 필터가 없다 — 의도적이다** (required status check 등록을 위해).
# 근거·메커니즘은 `scripts/ci-paths-changed.sh` 헤더 주석 참조.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: frontend-checks-${{ github.ref }}
  cancel-in-progress: true

# 이 워크플로는 읽기만 한다 — checkout 과 검사 실행뿐이다. 명시하지 않으면 저장소 기본
# 토큰 권한을 상속하는데, 그 기본값은 저장소 설정에 달려 있어 이 파일만 봐서는 알 수 없다.
#
# **일괄로 바르면 안 된다**: `migration-recheck-on-main.yml` 은 `gh pr comment` 때문에
# `pull-requests: write` 가 필요하다. 그래서 "모두 contents: read" 가 아니라
# **워크플로마다 필요한 값을 선언**하는 것이 규칙이고, `test_workflow_yaml_structure.py`
# 의 `_PERMISSIONS` 등록부가 그것을 강제한다.
permissions:
  contents: read

jobs:
  # 종전 `on.*.paths` 목록이 여기 한 곳에만 산다.
  changes:
    name: 변경 경로 판정
    uses: ./.github/workflows/_changed-paths.yml
    with:
      pathspecs: |
        codebase/frontend/**
        # **`typescript-toolchain` 가드가 이 경로의 `package.json` 을 읽는다.**
        # `discoverWorkspaceDirs()` 가 `pnpm-workspace.yaml` 에서 워크스페이스 셋을 뽑고
        # (`channel-web-chat` 포함), 각 디렉터리의 `package.json` 으로 toolchain 정합을
        # 검사한다(`typescript-toolchain-guard.ts` 의 manifest 읽기). 그 경로를 빼면
        # web-chat 의 toolchain 이 어긋나도 CI 가 못 잡는다 — `web-chat-checks` 는
        # `channel-web-chat...` 만 설치해 이 가드를 돌리지 않는다.
        #
        # > 한때 이 줄의 근거는 "미러 가드가 이 잡에 산다" 였는데, 그 가드가
        # > `repo-guards.yml` 로 옮겨 간 뒤 **근거만 갈아 끼우고 줄은 유지**한다.
        # > 소비처를 하나만 보고 지웠다가 두 번째 소비처를 놓칠 뻔했다(`14_02_49` W1).
        codebase/channel-web-chat/**
        codebase/packages/**
        pnpm-lock.yaml
        pnpm-workspace.yaml
        scripts/ci-paths-changed.sh
        .github/workflows/_changed-paths.yml
        # 공유 셋업 액션. `_changed-paths.yml` 을 등재한 것과 **같은 이유**다 —
        # 이 액션이 바뀌면 그것에 기대는 이 워크플로가 돌아야 한다. 추출로 새로
        # 생긴 의존이라 등재를 빠뜨리기 쉬운 자리다.
        .github/actions/pnpm-workspace/action.yml
        .github/workflows/frontend-checks.yml

  test-and-build:
    needs: changes
    # `changes` 가 실패/오류여도 이 잡은 돈다 — needs 실패로 skipped 되면
    # 'skipped 가 required check 를 만족하는가' 라는 모호함이 다른 경로로 재발한다.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 무관한 변경 — 검사 생략 (체크는 통과로 보고)
        if: needs.changes.outputs.relevant == 'false'
        run: echo "frontend/packages 관련 경로 변경 없음 — 이 잡은 no-op 으로 통과한다."

      - uses: actions/checkout@v7
        if: needs.changes.outputs.relevant != 'false'

      # pnpm + Node + `--frozen-lockfile` 설치. `...` 로 frontend 의 workspace 의존까지
      # 함께 설치한다 — 내부 패키지 dist 는 각 패키지 `prepare`(tsc)가 install 중 빌드한다.
      - uses: ./.github/actions/pnpm-workspace
        if: needs.changes.outputs.relevant != 'false'
        with:
          filter: 'frontend...'

      - name: Vitest (unit)
        if: needs.changes.outputs.relevant != 'false'
        run: pnpm --filter frontend test

      # `next build` 가 모든 docs 라우트(`/docs/<locale>/<...>`) 를
      # `generateStaticParams` 로 prerender 한다. MDX 안의 invalid 컴포넌트 prop
      # (e.g. `<Callout type="info">`) 은 여기서 server-side render 실패로 잡힌다.
      - name: Next build (prerender 검증)
        if: needs.changes.outputs.relevant != 'false'
        run: pnpm --filter frontend build

  typecheck-ratchet:
    name: frontend 타입체크 ratchet
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 무관한 변경 — 검사 생략 (체크는 통과로 보고)
        if: needs.changes.outputs.relevant == 'false'
        run: echo "frontend/packages 관련 경로 변경 없음 — 이 잡은 no-op 으로 통과한다."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.relevant != 'false'
      - uses: ./.github/actions/pnpm-workspace
        if: needs.changes.outputs.relevant != 'false'
        with:
          filter: 'frontend...'
      # 이 잡만 python 이 더 필요하다(ratchet 스크립트). 공유 액션 **뒤**에 두는 것은
      # 무관하다 — `pnpm install` 은 python 을 쓰지 않고, 아래 ratchet 스텝 전에만
      # 준비되면 된다.
      - uses: actions/setup-python@v7
        if: needs.changes.outputs.relevant != 'false'
        with:
          python-version: '3.x'
      # `tsconfig.json` 이 exclude 하는 테스트 파일까지 포함한 **전체 프로그램** 체크
      # (`tsconfig.typecheck.json`). vitest 는 타입을 strip 하고 `next build` 는 그
      # exclude 를 그대로 쓰므로, 테스트 코드의 타입 오류는 이 잡 말고 아무도 못 본다.
      # baseline 대비 증가·감소 둘 다 실패다. 스크립트 헤더에 전체 근거.
      - name: Typecheck ratchet
        if: needs.changes.outputs.relevant != 'false'
        run: python3 scripts/check-frontend-typecheck-ratchet.py
