# pnpm 워크스페이스 설치 — 전환된 워크플로 대부분이 그대로 복제하던 셋업 3단계.
#
# ## 왜 추출했나
#
# `#1106` 계열의 skip-job 전환이 끝난 시점(`#1114`, 워크플로 8개 / 실잡 14개)에 셋업 형태를
# 전수 분류했더니 **8개 잡이 `--filter` 인자 하나만 다른 바이트 동일 형태**였다:
#
#   frontend `test-and-build` · backend `lint` · backend `unit` · packages `packages`(matrix) ·
#   web-chat `sdk`·`widget`·`sdk-client` · spec-link `spec-link-integrity`
#
# 9번째(backend `typecheck-ratchet`)는 여기에 `setup-python` 만 더 붙는다. 나머지 5개
# (python 전용 · pip · 캐시 없는 node · `fetch-depth: 0`)는 진짜로 발산해서 대상이 아니다.
#
# `#1106` 이 "**4번째 전환 시점**에 판단" 을 트리거로 걸어 뒀고 `#1114` 가 그 시점을 지났다.
# 그때 함께 넣지 않은 이유는 난이도가 아니라 **축**이었다 — 그 PR 이 건드리지 않는 워크플로
# 3개를 함께 고쳐야 했다. `#1111` 이 `changes` 잡 추출을 별 PR 로 집행한 것과 같은 형태다.
#
# ## checkout 은 왜 안 들어 있나
#
# 로컬 composite action 은 `uses: ./.github/actions/…` 로 부르는데, 그 경로를 **해석하려면
# 저장소가 이미 체크아웃돼 있어야 한다.** 그래서 접히는 것은 4단계가 아니라 **뒤 3단계**이고
# 호출부에는 `checkout` + 이 액션 호출 두 스텝이 남는다.
#
# ## 게이팅과의 관계
#
# 호출부는 이 한 스텝에 `if: needs.changes.outputs.relevant != 'false'` 를 단다. 종전에는
# 같은 조건을 스텝 3개에 각각 달았고 **하나만 빠뜨려도 무관한 PR 에서 그 스텝이 실제로
# 실행**됐다(`test_required_check_skip_jobs.py::test_every_step_is_gated` 가 잡던 회귀).
# 안쪽 스텝은 이제 개별 게이팅 대상이 아니라 호출 하나에 묶이므로, 스텝을 하나 더 넣어도
# 게이팅을 잊을 자리가 없다 — 계약이 약해진 것이 아니라 빠뜨릴 자리가 사라진 것이다.
#
# 다만 안쪽 스텝은 `.github/workflows/*.yml` 만 훑는 가드의 시야 밖으로 나간다. 그래서
# `test_workflow_yaml_structure.py` 의 구조 검사(중복 키 · `run`/`uses` 정확히 하나 ·
# 실패 삼킴 금지)를 `.github/actions/**/action.yml` 까지 넓혔다 — 2026-08-01 의 중복 `run:`
# 사고가 여기서 재발하면 아무도 못 볼 뻔했다.

name: pnpm 워크스페이스 설치
description: >-
  pnpm + Node 24(+ pnpm 캐시)를 셋업하고 지정한 워크스페이스 스코프를
  `--frozen-lockfile --strict-peer-dependencies` 로 설치한다.
  checkout 은 호출부 책임이다(위 주석 참조).

inputs:
  filter:
    description: >-
      `pnpm --filter` 에 그대로 넘길 스코프. 워크스페이스 의존까지 포함하려면
      `...` 를 붙인다 (예: `frontend...` · `@workflow/web-chat...`).
    required: true

runs:
  using: composite
  steps:
    # pnpm 버전은 root package.json 의 `packageManager` 필드를 따른다.
    - uses: pnpm/action-setup@v6.0.9

    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml

    # `--frozen-lockfile` 은 장식이 아니다 — `deps-guard-hardening` 이 required check 로
    # 요구한 바로 그 보장이다. 여기서 빠지면 매니페스트와 어긋난 lockfile 이 이 action 을
    # 거치는 소비자 전부에서 조용히 통과한다. 2026-08-10 부터 `--strict-peer-dependencies`
    # 도 같은 자리에 산다.
    #
    # **"저장소에서 유일한 소재지" 가 아니다** — 종전 주석이 그렇게 적었고 그 프레이밍이
    # 정확히 이번 사고를 낳았다(action 만 고치고 전부 덮었다고 믿음). 여기는 **CI 워크플로가
    # 공유하는 한 줄**이고, `pnpm install` 자체는 다섯 곳에 있다(아래).
    #
    # `${{ }}` 를 `run:` 문자열에 직접 끼워 넣지 않고 `env:` 로 넘긴다 — 그 자리는 값이
    # 셸 **코드로** 읽히는 지점이라 호출부가 넣은 문자열이 명령이 될 수 있다. env 를 거치면
    # 셸은 언제나 데이터로 본다. `_changed-paths.yml` 이 세운 것과 같은 규율이고
    # `test_pnpm_workspace_action.py` 가 두 파일 모두에 대해 고정한다.
    # `--strict-peer-dependencies` 는 미충족 peer 를 경고에서 **실패**로 올린다. 그것이
    # 없어서 `#1049` 가 `eslint-plugin-unicorn` 을 `eslint>=10.4` 요구 버전으로 올린 채
    # 9.39.4 설치본 위에 머지됐고, 발견은 사람이 `#1058` 의 테스트 로그를 읽다가였다 —
    # **자동 신호가 없었다.** 여기 두는 이유는 위 `--frozen-lockfile` 과 같다: **9개 잡 / 5개 워크플로 파일**이
    # 이 action 하나를 거친다(`ConsumerBindingTest.consumers()` 실측). 다만 여기가
    # **전부는 아니다** — `pnpm install` 은 `.claude/test-stages.sh` 와 Dockerfile 3개에도
    # 있고 그쪽도 같은 플래그를 받는다. 다섯 곳을 다 짚어야 `#1049` 경로가 닫힌다.
    #
    # 예외 목록은 `pnpm-workspace.yaml` 의 `peerDependencyRules` 이고 **현재 비어 있다**
    # (2026-08-10 실측: 규칙 없이 exit 0, unmet peer 0건). 착수 근거였던
    # `nunjucks → chokidar` 는 그 사이 상류에서 사라졌다.
    - name: Install workspace
      shell: bash
      env:
        FILTER: ${{ inputs.filter }}
      run: pnpm install --frozen-lockfile --strict-peer-dependencies --filter "$FILTER"
