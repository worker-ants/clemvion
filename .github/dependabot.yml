version: 2
updates:
  # GitHub Actions workflow 의 액션 버전을 주 단위로 점검해 동일 deprecation
  # 사고를 사전 PR 로 차단한다.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # mermaid-lint 하네스 툴링의 독립 npm 트리. pnpm 워크스페이스 밖이라
  # deps-security-checks.yml(pnpm audit)·config-guard 어디에도 안 걸려, 여기에
  # 등록하기 전까지 이 트리의 CVE 는 영구 무신호였다(2026-07-18 undici HIGH +
  # dompurify moderate 를 뒤늦게 발견).
  #
  # 이 항목은 스케줄 version-update(주간)다. direct dep 은 jsdom · mermaid 두 개뿐이고
  # 나머지는 transitive 다. 이 트리는 거의 안 변하므로 비-보안 노이즈는 사실상 없다. 신규 CVE 즉시
  # 대응은 repo Settings 의 Dependabot **security updates**(스키마 밖, repo 토글)
  # 가 담당하며 여기 등록이 그 대상 트리로 편입시키는 전제다.
  # 다만 중간 패키지가 취약한 transitive 를 정확한 버전으로 고정하면 security update 는 고치지 못한다.
  # 2026-10-02 알림 #71 · #72 가 그랬다(chevrotain 11 이 lodash-es 4.17.23 을 고정). 그때는 direct
  # dep(mermaid)을 그 고정이 없는 버전으로 올려 해소했다.
  - package-ecosystem: "npm"
    directory: "/.claude/tools/mermaid-lint"
    schedule:
      interval: "weekly"

  # 루트 pnpm 워크스페이스(backend·frontend·channel-web-chat·packages/*).
  #
  # 2026-07-31 까지 이 트리는 **여기 미등록**이었고, npm_and_yarn 그룹 PR 은 repo Settings 의
  # Dependabot **security updates**(스키마 밖 토글)만 만들고 있었다. 그 결과 파일로 제어할
  # 여지가 없었고, 실제로 사고가 났다:
  #
  #   #1029 (보안 그룹) postcss ^8.5.14 → ^8.5.18 + lockfile 갱신 → CI success
  #   #1030 (next bump) **#1029 이전 base 에서 생성** → postcss 를 ^8.5.14 로 되돌림.
  #         lockfile 은 ^8.5.18 인 채 남아 `pnpm install --frozen-lockfile` 이
  #         ERR_PNPM_OUTDATED_LOCKFILE 로 실패 → main CI failure (#1034 가 복구).
  #
  # 등록해 두면 (a) 같은 group 의 순차 머지에서 rebase 가 적용되고, (b) grouping·
  # ignore 규칙을 파일로 관리할 수 있다(grouping 은 아래 `groups:`). `rebase-strategy: auto` 는 기본값이지만, 이번
  # 사고의 원인이 정확히 "구 base 에서 만들어진 PR" 이라 의도를 명시적으로 남긴다.
  #
  # 남은 갭: **`--frozen-lockfile` 검증을 required check 로 승격**하는 것은 repo Settings
  # (Branch protection) 소관이라 이 파일로 못 한다 — 옛 plan `deps-guard-hardening.md`(git 이력)
  # §3 에 수동 조치로 남겼다.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    rebase-strategy: "auto"
    # minor · patch 업데이트를 그룹 PR 로 묶는다(2026-10-02, NERV Task `CLE-T-M8RB67`).
    #
    # 의존성마다 PR 이 따로 오면 PR 마다 `pnpm-lock.yaml` 을 따로 고친다. 그래서 한 건을 머지하면
    # 나머지가 lockfile 충돌로 dependabot rebase 와 CI 재실행을 기다린다. 2026-10-02 에는 #1423 을
    # 머지한 뒤 #1445 · #1446 이 이렇게 멈췄다. main 에는 필수 검사가 없어서 머지할 때마다 사람이
    # `--frozen-lockfile` 을 다시 확인했다. 그룹 PR 은 묶인 업데이트의 lockfile 을 한 번에 만들기
    # 때문에 그 안에서는 이 충돌이 생기지 않는다.
    #
    # 충돌이 없어지는 범위는 한 그룹 안의 업데이트끼리다. 그룹 밖 PR(major 와 아래 제외 목록)과
    # 두 그룹 PR 은 여전히 같은 lockfile 을 고치므로 서로 충돌하고 dependabot rebase 로 풀린다.
    # 같은 날의 #1447(`@nestjs/jwt` 12)은 major 라 이 설정 뒤에도 따로 온다.
    #
    # major 는 묶지 않는다. 사람이 판단할 일이다(예: Nest 12 는 `@nestjs/*` 를 함께 올려야 한다).
    # 0.x 의 minor 업데이트(예: 0.79 → 0.80)는 minor 로 분류돼 그룹에 들어온다. breaking 일 수 있다.
    #
    # `exclude-patterns` 는 사유 핀(PROJECT.md §버전 핀 정책 (b)) 가운데 개별 PR 로 검토할 의존성이다.
    # dompurify · marked 는 sanitize 경로라서 공급망 무결성을 이유로 고정했다. three 는 0.x 라 minor 도
    # breaking 일 수 있어 tilde 로 고정했다. 그룹 PR 에 섞이면 diff 를 따로 보기 어려우므로 이 셋은 보안
    # 업데이트까지 의존성마다 따로 받는다. react · react-dom 은 핀 사유가 전역 버전 정렬이라 그룹에서
    # 함께 오르는 편이 낫다. jsonwebtoken · @radix-ui/react-focus-scope 는 상위 패키지(@nestjs/jwt ·
    # @radix-ui/react-dialog)가 exact 로 의존하는 버전과 맞춘 핀이라 그룹에 남겨 상위 패키지와 같은 PR 로
    # 올라가게 둔다. 하위 패키지가 먼저 나오면 혼자 올라갈 수 있으니 보장은 아니다.
    #
    # 그룹 PR 안의 한 의존성이 CI 를 깨면 그룹마다 다르게 처리한다.
    #   npm-minor-patch  그 PR 에 `@dependabot ignore <의존성 이름> minor version`(patch 면
    #                    `patch version`)을 남겨 그것만 뺀다. 이 제외는 dependabot 쪽에 저장되고
    #                    아래 `ignore:` 에는 남지 않는다. 오래 둘 제외는 사유와 함께 `ignore:` 로 옮긴다.
    #   npm-security     ignore 를 쓰지 않는다. 취약 버전을 벗어나는 업데이트까지 막을 수 있다. 깨진
    #                    의존성은 사람이 따로 올리거나 `pnpm-workspace.yaml` 의 `overrides` 로 바닥을 올린다.
    # 예외: `@playwright/test` 의 minor 는 e2e 이미지(`codebase/frontend/Dockerfile.playwright-e2e` 의
    # `FROM` 태그)와 major.minor 가 같아야 config-guard 를 통과한다. dependabot 은 그 태그를 고치지 못하므로
    # 그룹 PR 은 매번 깨진다. ignore 로 빼지 말고 둘을 함께 올리는 PR 을 따로 만든다. 그 PR 이 머지되면
    # 다음 그룹 PR 에서 playwright 가 빠진다(2026-10-02 #1449).
    #
    # 보안 업데이트를 켜고 끄는 것은 지금처럼 repo Settings 의 security updates 토글이고, 토글은 켜 둔다.
    # `npm-security` 그룹은 그 PR 을 묶는 방식만 정한다. major 가 필요한 보안 수정은 그룹 밖에서 따로 온다.
    # `patterns: ["*"]` 는 생략했을 때의 기본값이 문서에 없어서 적었다.
    # 이 그룹 설정은 `.claude/tests/test_dependabot_npm_coverage.py` 의 `DependabotGroupsTest` 가 고정한다.
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        exclude-patterns: ["dompurify", "marked", "three"]
        update-types: ["minor", "patch"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
        exclude-patterns: ["dompurify", "marked", "three"]
        update-types: ["minor", "patch"]
    ignore:
      # typescript major 는 자동 bump 대상에서 제외한다.
      #
      # 등록(#1043) 다음 날 #1047 이 `5.9.3` → **`7.0.2`** 를 올렸고 main 빌드가 통째로 깨졌다
      # (Jenkins Clemvion/337, backend·frontend 이미지 둘 다). TS7 은 Go 네이티브 재작성판이라
      # **JS compiler API 를 제공하지 않는다** — `require('typescript')` 가
      # `{version, versionMajorMinor}` 스텁만 돌려주고 compiler API 는 `typescript/unstable/*`
      # 라는 새 export 표면으로 옮겼다. 그 결과:
      #
      #   backend   @nestjs/cli 가 cwd 의 typescript 를 집어 → `nest build` 가
      #             "tsBinary.getParsedCommandLineOfConfigFile is not a function"
      #   frontend  packages/sdk 의 `prepare` tsc 가 @types/node 자동 포함 실패로 죽어
      #             `pnpm install` 자체가 중단
      #
      # 즉 TS major 는 "의존성 하나" 가 아니라 **전 빌드 툴체인의 계약**이다(nest CLI ·
      # ts-jest · fork-ts-checker · typescript-eslint 가 모두 `require('typescript')` 소비자이고,
      # typescript-eslint 의 peer 는 지금도 `>=4.8.4 <6.1.0` 이라 TS7 을 배제한다).
      # 생태계 대응이 끝난 뒤 **사람이** 올릴 판단을 해야 한다.
      #
      # 2026-10-04 사람이 6 으로 올렸다(NERV Task `CLE-T-8AY2KZ`). 6 은 compiler API 를 그대로
      # 둔 마지막 JS 라인이다. 이 항목은 이제 6 → 7 을 막는다. minor 로 6.1 이 나오면 위
      # typescript-eslint peer(`<6.1.0`)에 걸려 CI `--strict-peer-dependencies` 가 그 PR 을 실패시킨다.
      #
      # minor/patch 는 계속 받는다 — `update-types` 로 major 만 잘라낸다. 별개 토글인
      # security updates 도 patch 로 오는 한 영향 없다.
      #
      # 되살릴 조건: `require('typescript').getParsedCommandLineOfConfigFile` 이 다시 함수이고
      # 위 4개 소비자가 그 major 를 지원할 때. 회귀 가드가 그 계약을 검사한다 —
      # `codebase/frontend/src/lib/repo-guards/__tests__/typescript-toolchain.test.ts`
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

      # (묘비) `eslint-plugin-unicorn` major ignore 는 2026-08-28 부로 제거했다 — 위 항목이
      # 이 리스트의 유일한 원소인 이유. 존재 이유였던 "unicorn 66+ 가 `eslint@>=10.4` 를
      # 요구하는데 이 저장소는 eslint 9 였다" 는 backend·packages 의 eslint 10 상향
      # (옛 plan `deps-peer-gating-and-eslint10.md` §2(git 이력), unicorn 도 `^73` 동반 상향)
      # 으로 소멸했다. 재발 방지는 상시 가드로 이관: `eslint-unicorn-peer.spec.ts`(설치본
      # peer 실측) + CI `--strict-peer-dependencies`(unmet peer 즉시 실패) — `#1049` 당시엔
      # 둘 다 없어 무방비였다. 상세 이력은 `PROJECT.md` §버전·도구 정책 의 동명 각주.
      #
      # ⚠️ eslint 자체의 major 는 **여기서 막지 않는다**. frontend·channel-web-chat 은
      # eslint 9 에 남아 있는데(그쪽 `eslint-config-next` 스택이 eslint 10 을 배제한다 —
      # 실측 표와 해제 조건의 SoT 는 `codebase/frontend/eslint.config.mjs` 헤더),
      # 그 둘은 `eslint: "^9"` 로 선언돼 dependabot 이 major 를 올리면
      # `--strict-peer-dependencies` 가 CI 에서 즉시 빨간불을 낸다. 조용히 통과하는 경로가
      # 없으므로 사전 ignore 보다 사후 게이트가 낫다.
