version: 2
updates:
  # GitHub Actions workflow 의 액션 버전을 주 단위로 점검해 동일 deprecation
  # 사고를 사전 PR 로 차단한다.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # mermaid-lint 하네스 툴링의 독립 npm 트리. pnpm 워크스페이스 밖이라
  # deps-security-checks.yml(pnpm audit)·config-guard 어디에도 안 걸려, 여기에
  # 등록하기 전까지 이 트리의 CVE 는 영구 무신호였다(2026-07-18 undici HIGH +
  # dompurify moderate 를 뒤늦게 발견).
  #
  # 이 항목은 스케줄 version-update(주간)다 — direct dep 이 없고(transitive 만)
  # 이 트리는 거의 안 변하므로 비-보안 노이즈는 사실상 없다. 신규 CVE 즉시
  # 대응은 repo Settings 의 Dependabot **security updates**(스키마 밖, repo 토글)
  # 가 담당하며 여기 등록이 그 대상 트리로 편입시키는 전제다.
  - package-ecosystem: "npm"
    directory: "/.claude/tools/mermaid-lint"
    schedule:
      interval: "weekly"

  # 루트 pnpm 워크스페이스(backend·frontend·channel-web-chat·packages/*).
  #
  # 2026-07-31 까지 이 트리는 **여기 미등록**이었고, npm_and_yarn 그룹 PR 은 repo Settings 의
  # Dependabot **security updates**(스키마 밖 토글)만 만들고 있었다. 그 결과 파일로 제어할
  # 여지가 없었고, 실제로 사고가 났다:
  #
  #   #1029 (보안 그룹) postcss ^8.5.14 → ^8.5.18 + lockfile 갱신 → CI success
  #   #1030 (next bump) **#1029 이전 base 에서 생성** → postcss 를 ^8.5.14 로 되돌림.
  #         lockfile 은 ^8.5.18 인 채 남아 `pnpm install --frozen-lockfile` 이
  #         ERR_PNPM_OUTDATED_LOCKFILE 로 실패 → main CI failure (#1034 가 복구).
  #
  # 등록해 두면 (a) 같은 group 의 순차 머지에서 rebase 가 적용되고, (b) 향후 grouping·
  # ignore 규칙을 파일로 관리할 수 있다. `rebase-strategy: auto` 는 기본값이지만, 이번
  # 사고의 원인이 정확히 "구 base 에서 만들어진 PR" 이라 의도를 명시적으로 남긴다.
  #
  # 남은 갭: **`--frozen-lockfile` 검증을 required check 로 승격**하는 것은 repo Settings
  # (Branch protection) 소관이라 이 파일로 못 한다 — `plan/in-progress/deps-guard-hardening.md`
  # §3 에 수동 조치로 남겼다.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    rebase-strategy: "auto"
    ignore:
      # typescript major 는 자동 bump 대상에서 제외한다.
      #
      # 등록(#1043) 다음 날 #1047 이 `5.9.3` → **`7.0.2`** 를 올렸고 main 빌드가 통째로 깨졌다
      # (Jenkins Clemvion/337, backend·frontend 이미지 둘 다). TS7 은 Go 네이티브 재작성판이라
      # **JS compiler API 를 제공하지 않는다** — `require('typescript')` 가
      # `{version, versionMajorMinor}` 스텁만 돌려주고 compiler API 는 `typescript/unstable/*`
      # 라는 새 export 표면으로 옮겼다. 그 결과:
      #
      #   backend   @nestjs/cli 가 cwd 의 typescript 를 집어 → `nest build` 가
      #             "tsBinary.getParsedCommandLineOfConfigFile is not a function"
      #   frontend  packages/sdk 의 `prepare` tsc 가 @types/node 자동 포함 실패로 죽어
      #             `pnpm install` 자체가 중단
      #
      # 즉 TS major 는 "의존성 하나" 가 아니라 **전 빌드 툴체인의 계약**이다(nest CLI ·
      # ts-jest · fork-ts-checker · typescript-eslint 가 모두 `require('typescript')` 소비자이고,
      # typescript-eslint 의 peer 는 지금도 `>=4.8.4 <6.1.0` 이라 TS7 을 배제한다).
      # 생태계 대응이 끝난 뒤 **사람이** 올릴 판단을 해야 한다.
      #
      # minor/patch 는 계속 받는다 — `update-types` 로 major 만 잘라낸다. 별개 토글인
      # security updates 도 patch 로 오는 한 영향 없다.
      #
      # 되살릴 조건: `require('typescript').getParsedCommandLineOfConfigFile` 이 다시 함수이고
      # 위 4개 소비자가 그 major 를 지원할 때. 회귀 가드가 그 계약을 검사한다 —
      # `codebase/frontend/src/lib/repo-guards/__tests__/typescript-toolchain.test.ts`
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
