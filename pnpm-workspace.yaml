# pnpm workspace 정의 — 모노레포 단일 lockfile(pnpm-lock.yaml)의 앵커.
# 내부 패키지는 file:../packages/* 대신 workspace:* 프로토콜로 참조된다.
# .claude/tools/mermaid-lint 은 하니스 전용 독립 도구라 workspace 에 포함하지 않는다(자체 npm lockfile 유지).
packages:
  - "codebase/backend"
  - "codebase/frontend"
  - "codebase/channel-web-chat"
  - "codebase/packages/*"

# backend `pnpm deploy`(non-legacy)가 요구하는 설정(ERR_PNPM_DEPLOY_NONINJECTED_WORKSPACE).
# 이 값 덕에 deploy 산출물이 내부 @workflow/* 를 injected copy 로 격리해 패키지별 버전을
# 올바로 해소한다(legacy flat deploy 의 direct→transitive collapse 회피).
# 실측: `node-linker=isolated`(.npmrc) 에서도 워크스페이스 링크는 **symlink** 다 —
# backend·frontend·web-chat-sdk 모두 node_modules/@workflow/* 가 codebase/packages/* 로의
# symlink 로 유지됨을 확인. 즉 dev hot-reload·frontend next.config 의 symlink 전제는 불변이고,
# Next standalone 트레이서·native 모듈도 격리 트리에서 정상(plan §3 전환 시 both-stack e2e 로 검증).
injectWorkspacePackages: true

# 보안 취약점 해소용 전이 의존성 상향 핀 (pnpm 10 정규 위치 — 이전에는 package.json 의
# `pnpm.overrides` 였으나 pnpm 10.23 이 그 필드를 더 이상 읽지 않아 여기로 이전). pnpm
# overrides 는 workspace-global 이므로 패키지별 충돌 항목은 버전-레인지로 스코프한다.
# next>postcss 는 frontend·channel-web-chat 공통.
#
# undici 는 두 경로가 모두 8.x 다. backend 가 **직접 의존**(^8, 2026-10-04 #1483 에서 6 → 8)이고
# frontend · channel-web-chat > jsdom@30 이 **전이 의존**이다. 전이 경로는 아래 레인지 override 로,
# backend 는 선언 자체를 올려 관리한다. 직접 의존을 override 로 덮으면 매니페스트가 거짓말을 하게
# 된다.
#
# 2026-10-04: `undici@>=7.0.0 <7.29.0` 키를 걷었다(NERV Task `CLE-T-67BNAZ`). jsdom 30 이후 그 키에
# 걸리는 7.x 는 트리에 없었다. 대상이 없는데도 이 키는 openai 의 optional peer 범위
# `undici: >=5 <9` 를 `^7.29.0` 으로 다시 써서(pnpm overrides 는 peer 범위에도 적용된다)
# backend 의 undici 를 미충족 peer 로 만들고 있었다. 대상 없는 버전 레인지 override 는 죽은 설정이
# 아니라 이렇게 남의 peer 범위를 바꿀 수 있다.
# 같은 날 `lodash` · `liquidjs` · `html-to-text` · `linkify-it` · `svgo` 도 걷었다. 모두
# `@nestjs-modules/mailer`(NestJS 12 상향 때 제거)의 템플릿 엔진 · 미리보기 경로에만 있던 바닥 핀이라
# lockfile 에 대상이 0건이었고 이 다섯을 peer 로 선언한 패키지도 없었다. 다시 들어오더라도 취약 버전이면
# `pnpm audit`(deps-security-checks)가 잡는다. 핀은 그때 그 경로에 맞춰 다시 건다.
#
# **각 항목의 CVE 근거는 그 값을 올린 커밋 메시지에 있다.** 종전에는 "audit 커밋(b2bbb49e)
# 참조" 라고 적혀 있었으나 그 해시는 **저장소 어디에도 없다**(전 브랜치 `git log` 0건).
# pnpm 이전 커밋 이후 문구만 이어지고 해시는 한 번도 갱신되지 않았다 — 값이 바뀔 때마다
# 근거도 옮겨 가므로 단일 해시를 고정하는 방식 자체가 틀렸다. `git log -p pnpm-workspace.yaml`
# 로 그 줄이 바뀐 커밋을 찾는 것이 정확한 추적 경로다.
overrides:
  picomatch: ^4.0.4
  ip-address: ^10.7.1
  express-rate-limit: ^8.5.1
  protobufjs: ^7.6.5
  fast-uri: ^3.1.8
  hono: ^4.13.5
  # socket.io@4.8.3 이 `socket.io-parser: ~4.2.4` 를 요구한다 — 이 저장소의 다른 override 와
  # 달리 `^` 가 아니라 `~` 인 이유다. `^4.2.7` 로 두면 4.3.x 가 나왔을 때 override 가 부모의
  # 범위 계약을 깨고 강제 해소한다. GHSA-2m8v-j782-fhvr(high) 은 4.2.7 에서 패치됐다.
  "socket.io-parser": ~4.2.7
  uuid: ^13.0.2
  ws: ^8.21.0
  "@grpc/grpc-js": ^1.14.5
  multer: ^2.4.0
  form-data: ^4.0.6
  # 2026-10-02: 9.x 계열에는 고친 버전이 없다(GHSA-prgh-xp8r-p3m5 · GHSA-v53p-9fqp-m79j ·
  # GHSA-g57g-f23g-4646 모두 10.0.5~10.0.9 에서 패치). 직접 의존(backend)과 함께 10 으로 올린다.
  # 지금 nodemailer 를 쓰는 곳은 backend 의 직접 의존뿐이다. 그때 peer 로 함께 보던
  # `@nestjs-modules/mailer` 는 2026-10-04 NestJS 12 상향(NERV Task `CLE-T-3X627J`)에서 걷어 냈다.
  nodemailer: ^10.0.9
  next>postcss: ^8.5.18
  # GHSA-2v37-7h3g-55p8 (high). frontend 이 postcss 를 **직접** 의존하는데 그 경로가
  # lockfile 에서 낮은 nanoid 로 고정돼 있었다 — 같은 트리의 `next>postcss` 경로는 이미
  # 안전했다. 즉 postcss 값을 올리는 것으로는 두 경로 중 하나만 덮이므로, 취약한 패키지
  # 자체에 바닥을 건다.
  # `^` 가 4.x 를 배제하지만 제약이 아니다 — postcss 8.x 의 요구가 `^3.3.x` 라 트리에 3 계열만
  # 있다.
  #
  # **2026-08-21: advisory 범위가 넓어져 하한을 올렸다** (`<3.3.17` → `<3.3.18`). 종전 값
  # `^3.3.17` 은 게시 시점엔 충분했지만 그대로 두면 3.3.17 이 해소돼 다시 취약해진다 —
  # `check-override-floors.py` 가 그것을 잡았다. **advisory 범위는 나중에 넓어질 수 있으므로
  # override 값은 "한 번 정하면 끝" 이 아니다.**
  nanoid: ^3.3.18
  eslint-plugin-react-hooks: 7.0.1
  # GHSA-rfgv-xxqx-mfg5 외 6건(8.x) — frontend · channel-web-chat > jsdom@30 > undici. jsdom 선언이
  # `^8.x` 라 8 계열 안의 패치 버전으로만 올린다(다른 메이저를 끌어올리지 않게 레인지 키로 둔다).
  "undici@>=8.0.0 <8.10.2": ^8.10.2
  vite: ^8.0.16
  "@babel/core": ^7.29.7
  "@hono/node-server": ^2.0.5
  # GHSA-4mjr-xmp4-gh2g · GHSA-x5fp-wj9c-mxmx (moderate) — `qs` 6.15.2 가 두 경로로
  # 해소되고 있었다. 한쪽은 **프로덕션**이라 수용(`auditConfig.ignoreCves`) 대상이 아니다:
  #   codebase/backend > express@5.2.1 > qs        (prod)
  #   codebase/backend > supertest > superagent > qs (dev)
  # 부모 선언 범위가 각각 `^6.14.0` · `^6.14.1` 이라 `^6.16.0` 은 그 계약 안에 들어온다
  # (실측: `npm view express@5.2.1 dependencies.qs` · `npm view superagent@10.3.0 dependencies.qs`).
  # 즉 override 가 부모의 범위를 깨고 강제 해소하는 형태가 아니다.
  qs: ^6.16.0
  sharp: ^0.35.4
  "@opentelemetry/propagator-jaeger": ^2.9.0
  # advisory 범위가 넓어질 때는 **값뿐 아니라 키의 상한도** 함께 올린다 —
  # `js-yaml@>=4.0.0 <4.3.1` 로 두고 값만 `^4.3.2` 로 올리면 4.3.1 은 키 범위 밖이라
  # override 가 적용되지 않고, 취약한 4.3.1 이 그대로 해소된다(스코프 override 의 함정).
  # GHSA-2883-xcg3-v3hh (high) — 두 메이저 계열이 각각 3.15.2 · 4.3.2 에서 패치됐다.
  "js-yaml@>=4.0.0 <4.3.2": ^4.3.2
  "js-yaml@>=3.0.0 <3.15.2": ^3.15.2
  # 2026-10-02: advisory 범위가 넓어졌다(GHSA-6j4f-fj2g-mc7p · GHSA-qhr7-859c-m2p7 ·
  # GHSA-q2hr-2g5m-vwhr — 1.x 는 1.1.21, 5.x 는 5.0.12 에서 패치). 키 상한도 값과 함께 올린다
  # (위 js-yaml 주석의 함정 — 5.0.9 가 옛 키 `<5.0.8` 밖이라 override 가 걸리지 않았다).
  "brace-expansion@<2.0.0": ^1.1.21
  "brace-expansion@>=2.0.0 <3.0.0": ^5.0.12
  "brace-expansion@>=3.0.0 <5.0.12": ^5.0.12
  # GHSA-2gc4-cqfq-p2gv (high) — backend > socket.io@4.8.3 > engine.io. socket.io 의 선언이
  # `~6.6.0` 이라 `^` 가 아니라 `~` 로 둔다(socket.io-parser 와 같은 이유).
  "engine.io": ~6.6.10
  # proxy-addr · source-map-js · `js-yaml@3>argparse` 는 2026-10-08 에 더했다(NERV Task `CLE-T-NC8BS7`).
  # GHSA-jqcg-44mw-7w3h (critical) — backend > express@5.2.1 > proxy-addr, **프로덕션** 경로다.
  # 2.0.8 에서 패치됐다. express 의 선언이 `^2.0.7` 이라 그 범위 안에서 올린다
  # (실측: `npm view express@5.2.1 dependencies.proxy-addr`). 결함은 신뢰 서브넷 판정에만 있고
  # backend 는 `trust proxy` 를 홉 수 `1` 로 둔다(`main.ts`).
  proxy-addr: ^2.0.8
  # GHSA-68fv-2mgg-jv7q (high) — 소비처 넷(postcss · css-tree · @eslint/css-tree ·
  # @tailwindcss/node)이 모두 `^1.2.1` 을 선언하고 1.2.2 에서 패치됐다. frontend > @tailwindcss/postcss
  # 경로가 프로덕션이다.
  source-map-js: ^1.2.2
  # GHSA-hp3w-g68c-fv3c (moderate) — sprintf-js 는 패치 버전이 없다(`<=1.1.3`, 최신 1.1.3).
  # 들어오는 길은 js-yaml@3 > argparse@1 하나이고 frontend > gray-matter 경로가 **프로덕션**이라
  # 수용(`auditConfig.ignoreCves`)하지 않고 argparse 를 2.x 로 올려 sprintf-js 를 트리에서 뺀다.
  # argparse 2 에는 의존성이 없다. 이 항목은 보안 하한이 아니라 sprintf-js 를 트리에서 빼려는 것이다.
  # 이 override 는 js-yaml@3 의 선언 `^1.0.7` 을 벗어난다. 그래도 되는 근거(2026-10-08 실측):
  #   - js-yaml@3.15.2 의 라이브러리(`index.js` · `lib/**`)는 argparse 를 require 하지 않는다.
  #     argparse 를 쓰는 곳은 CLI `bin/js-yaml.js` 하나다.
  #   - 그 CLI 는 워크스페이스 패키지의 `.bin` 에 없다. pnpm 이 gray-matter ·
  #     @istanbuljs/load-nyc-config 의 비공개 `node_modules/.bin` 에 shim 을 두지만 두 패키지는
  #     라이브러리만 쓴다.
  #   - argparse 2.0.1 에는 옛 API 호환층이 있어 CLI 도 폐기 경고만 내고 그대로 돈다
  #     (YAML → JSON 변환 exit 0).
  # 그래서 키를 `js-yaml@3>` 로 좁혔다. argparse@1 API 를 실제로 쓰는 다른 소비처가 생겨도 이
  # override 는 그 경로에 걸리지 않는다.
  # 걷는 조건: sprintf-js 패치가 나오거나 js-yaml@3 소비처(gray-matter · @istanbuljs/load-nyc-config)가
  # 트리에서 사라지면 이 키와 `check-pnpm-security-config.py` 의 `EXPECTED_OVERRIDES` 항목,
  # `.claude/tests/test_override_floors.py` 의 `argparse` 단언을 함께 지운다.
  # 다시 볼 때: lockfile 의 js-yaml 3.x 가 바뀌면 그 판의 `lib/**` 에 argparse require 가 없는지
  # `grep -rn argparse node_modules/.pnpm/js-yaml@3.*/node_modules/js-yaml/lib` 로 확인한다.
  "js-yaml@3>argparse": ^2.0.1

# pnpm v10 은 lifecycle(build) script 를 기본 차단한다 (pnpm 10 정규 위치 — package.json
# `pnpm.onlyBuiltDependencies` 에서 이전). 네이티브/바이너리 빌드가 필요한 패키지만 허용.
# 설치 시 'Ignored build scripts' 경고로 추가 항목을 발견하면 보충한다.
onlyBuiltDependencies:
  - isolated-vm
  - bcrypt
  - esbuild
  - "@swc/core"
  - "@tailwindcss/oxide"

# 의존성 취약점 audit 정책 — CI(.github/workflows/deps-security-checks.yml)가
# `pnpm audit --audit-level=moderate` 로 신규 moderate+ 취약점을 PR·주간 스케줄에서
# 차단한다. 아래 `ignoreCves` 는 **검토 후 수용(accept)한** 취약점 — 신규 CVE 를
# 사유 없이 억제 금지.
#
# **수용에 요구되는 근거 (2026-07-31 규약화)** — 아래 셋을 주석에 남긴다. "근거를 쓰라" 만으로는
# 부족했다: 2026-07-31 `#1038` 이 brace-expansion 을 "두 경로 모두 dev 전용" 이라 수용했는데
# 세 번째 경로가 프로덕션이었다(당시 경로 `@nestjs-modules/mailer > mjml > … > brace-expansion`.
# mailer 는 2026-10-04 에 걷어 내 지금 트리에는 없다). 원인은
# 판단이 아니라 **검증 절차**였다 — audit 출력의 `paths` 를 잘라 보고(`[:3]`) 세 번째를 못 봤고,
# `--prod` 를 돌리지 않았다. flag 없는 `pnpm audit` 은 dev/prod 를 구분하지 않는다.
#
#   1. `pnpm audit --prod --audit-level=moderate` 결과 — 해당 CVE 가 **프로덕션 트리에 없음**
#      을 보이는 출력. prod 에 있으면 수용이 아니라 해소가 원칙이다.
#   2. 프로덕션 이미지 실물 확인 — `docker run --rm --entrypoint sh <backend-image> -c
#      'ls -d node_modules/.pnpm/<pkg>@*'`. optional peer 가 pnpm 에 의해 충족돼 이미지에
#      들어가는 경우가 있다(위 mjml 사례가 정확히 그것).
#   3. **자르지 않은** 전체 경로 목록 — `paths` 를 슬라이싱하지 말 것.
#
# 해소가 가능한데 수용하지 않는다. `#1038` 은 위 절차로 재검증해 수용 대신 실제 해소로 전환했다
# (2.x 를 5.x 로 올려 `--prod` 0건 달성, dev 전용 1.x 경로만 남겨 수용).
#
# `ignoreCves` 는 경로를 가리지 않고 그 CVE 를 전역으로 지운다. 그래서 위 근거는 수용한 날의
# 실측일 뿐이고 CI 는 다시 확인하지 않는다. 의존성을 더하거나 올릴 때 수용한 CVE 가 프로덕션
# 트리로 들어오지 않았는지 `pnpm audit --prod` 와 `pnpm why <pkg> -r --prod` 로 다시 본다.
#
# 항목을 더하거나 뺄 때는 `scripts/check-pnpm-security-config.py` 의 `EXPECTED_IGNORED_CVES` 와
# **함께** 고친다(2-place 규약).
auditConfig:
  ignoreCves:
    # CVE-2026-93687 (GHSA-vfj7-8cjw-p6xm, braces <=3.0.3, high) — 2026-10-04 수용, NERV Task
    # `CLE-T-NFW7DE`. 깊이 중첩된 패턴에서 스택이 바닥나는 DoS 다. 패치 버전이 없어(`<0.0.0`)
    # override 로 해소할 수 없다. braces 최신판이 3.0.3 이고 `@next/eslint-plugin-next` 최신
    # 16.3.8 도 `fast-glob` 3.3.1 을 exact 로 의존한다(2026-10-04 `npm view`). 위 서문의 3종 근거를
    # 이 CVE 에 이렇게 확인했다:
    #   1. `pnpm audit --prod --audit-level=moderate` → "No known vulnerabilities found".
    #   2. 이미지 실물: backend · frontend 빌드 확인 이미지(`clemvion-build-check/*:latest`)에서
    #      `find / -type d -path "*node_modules*" -name "braces*"` 결과 0줄. frontend 는
    #      `micromatch*` 도 0줄이다(standalone 출력이 dev 트리를 싣지 않는다).
    #   3. 전체 경로(`pnpm why braces -r`, lockfile 의 braces 는 3.0.3 하나뿐):
    #        frontend         (devDependencies) > eslint-config-next > @next/eslint-plugin-next
    #                         > fast-glob@3.3.1 > micromatch@4.0.8 > braces@3.0.3
    #        channel-web-chat (devDependencies) > eslint-config-next > @next/eslint-plugin-next
    #                         > fast-glob@3.3.1 > micromatch@4.0.8 > braces@3.0.3
    #      (보강 설명, 실측 아님) 이 경로의 입력은 저장소의 lint 대상 경로 글롭이라 외부에서 오는
    #      패턴이 없다.
    # 해소 조건: braces 패치 버전이 나오거나 `@next/eslint-plugin-next` 가 micromatch 경로를
    # 걷으면 이 항목을 지우고 `check-pnpm-security-config.py` 의 `EXPECTED_IGNORED_CVES` 도 함께 지운다.
    # 패치 출시를 알리는 장치는 없으므로 분기마다 `npm view braces version` 으로 다시 본다.
    #
    # 종전 이력: 2026-08-01 에 **비워 두었다.** 그때 있던 2건은 실측으로 무효가 확인돼 제거했다.
    #   - CVE-2026-53550 (js-yaml <3.15.0): 우리 override `js-yaml@>=3.0.0 <3.15.0: ^3.15.0`
    #     가 gray-matter 경로를 3.15.0 으로 올려 **해소**됐다(수용이 아니라 해결).
    #   - CVE-2026-14257 (brace-expansion): 수용했던 dev 전용 1.x 경로는 그대로 있지만
    #     (`@eslint/eslintrc > minimatch@3.1.5 > brace-expansion@1.1.18`) advisory 가 더 이상
    #     그 계열을 매칭하지 않는다. 원래 취약 범위 `<=5.0.7` 이 major 를 안 가려 1.x·2.x 까지
    #     끌어당기던 것이 상류에서 정정된 것으로 보인다. 실측: `ignoreCves: []` + 취약 버전을
    #     lockfile 에 고정한 상태에서 `--audit-level=low` 로 돌려도 0건.
    #
    # 그 둘을 되살리지 않은 것이 fail-closed 다. 둘 중 하나라도 다시 보고되면 audit 잡이 빨간불을
    # 내고 서문의 3종 근거로 재심사하게 된다.
    - CVE-2026-93687

# ── peer dependency 게이트 ──────────────────────────────────────────────────
#
# `pnpm install --strict-peer-dependencies` 를 게이트로 둔다. 소재지는 **`pnpm install`
# 호출부 5곳 전부**다 — 한 곳만 짚으면 나머지로 그대로 새 나간다(직전 리뷰가 잡은 결함):
#
#   - `.github/actions/pnpm-workspace/action.yml` — 9개 잡 / 5개 워크플로 파일이 거친다(실측)
#   - `.claude/test-stages.sh` — 로컬 / TEST WORKFLOW
#   - `codebase/backend/Dockerfile` · `codebase/frontend/Dockerfile` ·
#     `codebase/frontend/Dockerfile.playwright-e2e` — 이미지 빌드
#
# **예외 목록(`peerDependencyRules`)은
# 비어 있고, 비어 있는 것이 정상이다.**
#
# 착수 근거였던 `nunjucks → chokidar` 미충족은 **이미 사라졌다**(2026-08-10 실측:
# 규칙 없이 `--strict-peer-dependencies --frozen-lockfile` → exit 0, unmet peer 0건).
# `plan/in-progress/deps-peer-gating-and-eslint10.md` §1 이 "지금 켜면 기존 미충족에
# 즉시 걸린다" 고 적어 둔 전제는 2026-08-01 기준이었고 그 사이 상류가 정리됐다.
#
# 그래서 억제 규칙을 **넣지 않았다** — 막을 대상이 없는 억제는 죽은 설정이고, 나중에
# 진짜 미충족이 그 자리에 생기면 조용히 덮어 버린다(fail-open). 예외가 필요해지면
# 그때 `peerDependencyRules:` 를 신설하고, 각 항목에 **"왜 안전한가" 를 실측 근거로**
# 적을 것 — "동작할 것이다" 가 아니라 "그 코드에 도달하지 않는다" 처럼.
