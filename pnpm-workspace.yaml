# pnpm workspace 정의 — 모노레포 단일 lockfile(pnpm-lock.yaml)의 앵커.
# 내부 패키지는 file:../packages/* 대신 workspace:* 프로토콜로 참조된다.
# .claude/tools/mermaid-lint 은 하니스 전용 독립 도구라 workspace 에 포함하지 않는다(자체 npm lockfile 유지).
packages:
  - "codebase/backend"
  - "codebase/frontend"
  - "codebase/channel-web-chat"
  - "codebase/packages/*"

# backend `pnpm deploy`(non-legacy)가 요구하는 설정(ERR_PNPM_DEPLOY_NONINJECTED_WORKSPACE).
# 이 값 덕에 deploy 산출물이 내부 @workflow/* 를 injected copy 로 격리해 패키지별 버전을
# 올바로 해소한다(legacy flat deploy 의 direct→transitive collapse 회피).
# 실측: `node-linker=isolated`(.npmrc) 에서도 워크스페이스 링크는 **symlink** 다 —
# backend·frontend·web-chat-sdk 모두 node_modules/@workflow/* 가 codebase/packages/* 로의
# symlink 로 유지됨을 확인. 즉 dev hot-reload·frontend next.config 의 symlink 전제는 불변이고,
# Next standalone 트레이서·native 모듈도 격리 트리에서 정상(plan §3 전환 시 both-stack e2e 로 검증).
injectWorkspacePackages: true

# 보안 취약점 해소용 전이 의존성 상향 핀 (pnpm 10 정규 위치 — 이전에는 package.json 의
# `pnpm.overrides` 였으나 pnpm 10.23 이 그 필드를 더 이상 읽지 않아 여기로 이전). pnpm
# overrides 는 workspace-global 이므로 패키지별 충돌 항목은 버전-레인지로 스코프한다.
# next>postcss 는 frontend·channel-web-chat 공통.
#
# undici 는 두 경로가 서로 다른 메이저를 쓴다: backend 가 **직접 의존**(^6)이고,
# channel-web-chat > jsdom 이 **전이 의존**(7.x)이다. 그래서 7.x 는 여기 레인지 override 로,
# 6.x 는 backend 의 선언 자체를 올려 관리한다 — 직접 의존을 override 로 덮으면 매니페스트가
# 거짓말을 하게 된다. (2026-08-07 이전 서술은 "backend 6.x 불변" 이었는데, 그 6.x 경로가
# GHSA-v3r7-h72x-cjcm 등에 취약한 6.27.0 으로 해소되고 있어 ^6.28.0 으로 올렸다. 전이 경로를
# "frontend" 라고 적은 것도 틀렸다 — channel-web-chat 이다.)
#
# **각 항목의 CVE 근거는 그 값을 올린 커밋 메시지에 있다.** 종전에는 "audit 커밋(b2bbb49e)
# 참조" 라고 적혀 있었으나 그 해시는 **저장소 어디에도 없다**(전 브랜치 `git log` 0건).
# pnpm 이전 커밋 이후 문구만 이어지고 해시는 한 번도 갱신되지 않았다 — 값이 바뀔 때마다
# 근거도 옮겨 가므로 단일 해시를 고정하는 방식 자체가 틀렸다. `git log -p pnpm-workspace.yaml`
# 로 그 줄이 바뀐 커밋을 찾는 것이 정확한 추적 경로다.
overrides:
  lodash: ^4.18.0
  picomatch: ^4.0.4
  liquidjs: ^10.27.1
  ip-address: ^10.2.0
  express-rate-limit: ^8.5.1
  protobufjs: ^7.6.5
  fast-uri: ^3.1.5
  hono: ^4.12.34
  # socket.io@4.8.3 이 `socket.io-parser: ~4.2.4` 를 요구한다 — 이 저장소의 다른 override 와
  # 달리 `^` 가 아니라 `~` 인 이유다. `^4.2.7` 로 두면 4.3.x 가 나왔을 때 override 가 부모의
  # 범위 계약을 깨고 강제 해소한다. GHSA-2m8v-j782-fhvr(high) 은 4.2.7 에서 패치됐다.
  "socket.io-parser": ~4.2.7
  uuid: ^13.0.2
  ws: ^8.21.0
  "@grpc/grpc-js": ^1.14.4
  multer: ^2.2.0
  form-data: ^4.0.6
  nodemailer: ^9.0.1
  next>postcss: ^8.5.18
  # GHSA-2v37-7h3g-55p8 (high, <3.3.17). frontend 이 postcss 를 **직접** 의존하는데 그 경로가
  # lockfile 에서 postcss@8.5.25 > nanoid@3.3.16 으로 고정돼 있었다 — 같은 트리의
  # `next>postcss` 경로는 8.5.26 > 3.3.17 이라 이미 안전했다. 즉 postcss 값을 올리는 것으로는
  # 두 경로 중 하나만 덮이므로, 취약한 패키지 자체에 바닥을 건다.
  # `^` 가 4.x 를 배제하지만 제약이 아니다 — postcss 8.x 의 요구가 `^3.3.x` 라 트리에 3 계열만
  # 있다(실측: lockfile 의 nanoid 엔트리는 3.3.16·3.3.17 둘뿐).
  nanoid: ^3.3.17
  eslint-plugin-react-hooks: 7.0.1
  "undici@>=7.0.0 <7.29.0": ^7.29.0
  vite: ^8.0.16
  "@babel/core": ^7.29.7
  "@hono/node-server": ^2.0.5
  linkify-it: ^5.0.2
  svgo: ^4.0.2
  sharp: ^0.35.0
  "@opentelemetry/propagator-jaeger": ^2.9.0
  "js-yaml@>=4.0.0 <4.3.1": ^4.3.1
  "js-yaml@>=3.0.0 <3.15.1": ^3.15.1
  "brace-expansion@<2.0.0": ^1.1.16
  "brace-expansion@>=2.0.0 <3.0.0": ^5.0.9
  "brace-expansion@>=3.0.0 <5.0.8": ^5.0.8

# pnpm v10 은 lifecycle(build) script 를 기본 차단한다 (pnpm 10 정규 위치 — package.json
# `pnpm.onlyBuiltDependencies` 에서 이전). 네이티브/바이너리 빌드가 필요한 패키지만 허용.
# 설치 시 'Ignored build scripts' 경고로 추가 항목을 발견하면 보충한다.
onlyBuiltDependencies:
  - isolated-vm
  - bcrypt
  - esbuild
  - "@swc/core"
  - "@tailwindcss/oxide"

# 의존성 취약점 audit 정책 — CI(.github/workflows/deps-security-checks.yml)가
# `pnpm audit --audit-level=moderate` 로 신규 moderate+ 취약점을 PR·주간 스케줄에서
# 차단한다. 아래 `ignoreCves` 는 **검토 후 수용(accept)한** 취약점 — 신규 CVE 를
# 사유 없이 억제 금지.
#
# **수용에 요구되는 근거 (2026-07-31 규약화)** — 아래 셋을 주석에 남긴다. "근거를 쓰라" 만으로는
# 부족했다: 2026-07-31 `#1038` 이 brace-expansion 을 "두 경로 모두 dev 전용" 이라 수용했는데
# 세 번째 경로가 프로덕션이었다(`@nestjs-modules/mailer > mjml > … > brace-expansion`). 원인은
# 판단이 아니라 **검증 절차**였다 — audit 출력의 `paths` 를 잘라 보고(`[:3]`) 세 번째를 못 봤고,
# `--prod` 를 돌리지 않았다. flag 없는 `pnpm audit` 은 dev/prod 를 구분하지 않는다.
#
#   1. `pnpm audit --prod --audit-level=moderate` 결과 — 해당 CVE 가 **프로덕션 트리에 없음**
#      을 보이는 출력. prod 에 있으면 수용이 아니라 해소가 원칙이다.
#   2. 프로덕션 이미지 실물 확인 — `docker run --rm --entrypoint sh <backend-image> -c
#      'ls -d node_modules/.pnpm/<pkg>@*'`. optional peer 가 pnpm 에 의해 충족돼 이미지에
#      들어가는 경우가 있다(위 mjml 사례가 정확히 그것).
#   3. **자르지 않은** 전체 경로 목록 — `paths` 를 슬라이싱하지 말 것.
#
# 해소가 가능한데 수용하지 않는다. `#1038` 은 위 절차로 재검증해 수용 대신 실제 해소로 전환했다
# (2.x 를 5.x 로 올려 `--prod` 0건 달성, dev 전용 1.x 경로만 남겨 수용).
auditConfig:
  ignoreCves:
    # 2026-08-01 현재 **비어 있다.** 종전 2건은 실측으로 무효가 확인돼 제거했다.
    #   - CVE-2026-53550 (js-yaml <3.15.0): 우리 override `js-yaml@>=3.0.0 <3.15.0: ^3.15.0`
    #     가 gray-matter 경로를 3.15.0 으로 올려 **해소**됐다(수용이 아니라 해결).
    #   - CVE-2026-14257 (brace-expansion): 수용했던 dev 전용 1.x 경로는 그대로 있지만
    #     (`@eslint/eslintrc > minimatch@3.1.5 > brace-expansion@1.1.18`) advisory 가 더 이상
    #     그 계열을 매칭하지 않는다. 원래 취약 범위 `<=5.0.7` 이 major 를 안 가려 1.x·2.x 까지
    #     끌어당기던 것이 상류에서 정정된 것으로 보인다. 실측: `ignoreCves: []` + 취약 버전을
    #     lockfile 에 고정한 상태에서 `--audit-level=low` 로 돌려도 0건.
    #
    # 비워둔 것이 fail-closed 다 — 둘 중 하나라도 다시 보고되면 audit 잡이 빨간불을 내고
    # 위 3종 근거로 재심사하게 된다. 되살릴 때는 `check-pnpm-security-config.py` 의
    # `EXPECTED_IGNORED_CVES` 와 **함께** 고친다(2-place 규약).
    []

# ── peer dependency 게이트 ──────────────────────────────────────────────────
#
# `pnpm install --strict-peer-dependencies` 를 게이트로 둔다. 소재지는 **`pnpm install`
# 호출부 5곳 전부**다 — 한 곳만 짚으면 나머지로 그대로 새 나간다(직전 리뷰가 잡은 결함):
#
#   - `.github/actions/pnpm-workspace/action.yml` — 9개 잡 / 5개 워크플로 파일이 거친다(실측)
#   - `.claude/test-stages.sh` — 로컬 / TEST WORKFLOW
#   - `codebase/backend/Dockerfile` · `codebase/frontend/Dockerfile` ·
#     `codebase/frontend/Dockerfile.playwright-e2e` — 이미지 빌드
#
# **예외 목록(`peerDependencyRules`)은
# 비어 있고, 비어 있는 것이 정상이다.**
#
# 착수 근거였던 `nunjucks → chokidar` 미충족은 **이미 사라졌다**(2026-08-10 실측:
# 규칙 없이 `--strict-peer-dependencies --frozen-lockfile` → exit 0, unmet peer 0건).
# `plan/in-progress/deps-peer-gating-and-eslint10.md` §1 이 "지금 켜면 기존 미충족에
# 즉시 걸린다" 고 적어 둔 전제는 2026-08-01 기준이었고 그 사이 상류가 정리됐다.
#
# 그래서 억제 규칙을 **넣지 않았다** — 막을 대상이 없는 억제는 죽은 설정이고, 나중에
# 진짜 미충족이 그 자리에 생기면 조용히 덮어 버린다(fail-open). 예외가 필요해지면
# 그때 `peerDependencyRules:` 를 신설하고, 각 항목에 **"왜 안전한가" 를 실측 근거로**
# 적을 것 — "동작할 것이다" 가 아니라 "그 코드에 도달하지 않는다" 처럼.
