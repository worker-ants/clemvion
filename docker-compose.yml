services:
  postgres:
    image: pgvector/pgvector:${POSTGRES_VERSION:-pg18}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    # **이미지는 `pgsty/silo` 다** (2026-09-24) — MinIO 서버의 커뮤니티 포크(AGPL-3.0,
    # 2026-08-06 `pgsty/minio` 에서 개명). MinIO 공식 이미지는 두 레지스트리 모두 닫혔다:
    # Docker Hub `minio/*` 익명 pull 차단(2026-09-12) → quay.io 로 옮겼는데 quay 의
    # `minio/*` 도 2026-09-24 비공개가 됐다(`unauthorized`, 같은 시각 다른 quay 저장소는 200).
    #
    # 호환: `MINIO_*` 환경변수 · `server` 명령(엔트리포인트가 `silo server` 로 번역) ·
    # `/minio/health/live` · 옛 MinIO 가 쓴 `/data` 볼륨을 그대로 쓴다(실측 — 근거와 대안
    # 검토는 plan `minio-silo-image`).
    #
    # W-59 — 'latest' 는 silent breaking change 위험. RELEASE 태그 **+ 다이제스트**로 고정한다
    # (Docker Hub 태그는 가변). `-distroless` 태그는 쓰지 말 것 — `curl` 이 없어 아래
    # 헬스체크가 깨진다. createbuckets 와 **같은 이미지**다 — 올릴 때 두 줄을 함께 올린다.
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  createbuckets:
    # 서버와 **같은 이미지**를 쓴다 — 클라이언트(`mcli`)가 들어 있고 `/usr/bin/mc` 가 그것을
    # 가리키는 심볼릭 링크라 아래 `mc …` 명령이 그대로 돈다. 그 링크는 Dockerfile 에만 있고
    # README 는 `mcli` 로만 소개한다 — 이미지를 올릴 때 링크가 남아 있는지 확인할 것.
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    depends_on:
      minio:
        condition: service_healthy
    # 비밀번호의 셸 메타문자(>, <, &, ; 등)가 entrypoint 평문 치환 후 /bin/sh 에
    # 의해 재파싱되는 것을 막기 위해 환경변수로 주입한 뒤 컨테이너 셸에서
    # 큰따옴표로 감싸 참조한다. compose 의 변수 보간 우회를 위해 $$ 로 이스케이프.
    #
    # 아바타 공개 읽기 정책은 아바타 업로드(§6.1)의 **배포 선행 조건**이다. 없으면 업로드는
    # 성공하고 **이미지만 403** 이 된다 — 증상이 업로드가 아니라 표시에서 난다.
    #
    # 정책을 파일로 두고 `set-json` 으로 적용한다. `mc anonymous set download` 는 이름과
    # 달리 접두에 걸면 **`s3:ListBucket` 을 함께 연다**(실측). 목록이 열리면 공개 버킷에서
    # 아바타를 지키는 유일한 수단인 키 UUID 의 추측 불가능성이 무의미해진다.
    # 기각 근거와 실측 명령: `scripts/minio/README.md`
    volumes:
      - ./scripts/minio/avatars-public-read.json:/policy/avatars-public-read.json:ro
    environment:
      MC_USER: ${MINIO_ROOT_USER}
      MC_PASS: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MC_USER\" \"$$MC_PASS\";
      mc mb local/workflow-storage --ignore-existing;
      mc anonymous set-json /policy/avatars-public-read.json local/workflow-storage;
      exit 0;
      "

  # ---------------- App stack (opt-in via `--profile app`) ----------------
  # `docker compose --profile app up` 으로만 기동. profile 없는 `docker compose up`
  # 은 인프라(postgres/redis/minio/createbuckets)만 띄워 host-mode dev와 호환.

  migrate:
    profiles: ["app"]
    build:
      context: .
      dockerfile: codebase/backend/migrations/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    # Dockerfile 의 COPY 는 K8s/CI 이미지 빌드용으로 유지하고, compose 에서는
    # 호스트 codebase/backend/migrations 를 그대로 노출시켜 새 V###__*.sql/.conf 추가 시
    # 이미지 재빌드 없이 즉시 반영되도록 한다. Flyway 기본 location 이 /flyway/sql
    # 이므로 별도 -locations 플래그 불필요. SQL 디렉터리에는 쓰지 않으므로 :ro.
    volumes:
      - ./codebase/backend/migrations:/flyway/sql:ro
    # 배열 형태: 셸 파싱을 거치지 않으므로 JDBC URL의 ':' / '=' 가 안전.
    command:
      - migrate
      - -url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - -user=${POSTGRES_USER}
      - -password=${POSTGRES_PASSWORD}
      - -baselineOnMigrate=true
      - -connectRetries=20
    restart: "no"

  # checksum mismatch 등으로 `migrate` 가 validation 에서 멈췄을 때 수동으로 호출하는
  # 복구 서비스. `flyway_schema_history` 의 checksum 을 현재 파일 기준으로 재기록한 뒤
  # 다시 `docker compose up migrate` 로 정상 마이그를 재개한다. 정상 부팅 흐름에서는
  # 호출되지 않아야 하므로 backend 의 depends_on 에 포함시키지 않는다.
  migrate-repair:
    profiles: ["app"]
    build:
      context: .
      dockerfile: codebase/backend/migrations/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./codebase/backend/migrations:/flyway/sql:ro
    command:
      - repair
      - -url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - -user=${POSTGRES_USER}
      - -password=${POSTGRES_PASSWORD}
      - -connectRetries=20
    restart: "no"

  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: codebase/backend/Dockerfile
      target: deps
    working_dir: /app/codebase/backend
    command: ["pnpm", "run", "start:dev"]
    env_file:
      - ./codebase/backend/.env
    # @nestjs/config 는 process.env 에 이미 있는 키를 덮어쓰지 않으므로,
    # 여기 environment 가 codebase/backend/.env 의 동명 키를 항상 이긴다.
    environment:
      NODE_ENV: development
      APP_PORT: "3011"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      S3_ENDPOINT: http://minio:9000
      # 브라우저가 아바타 이미지를 가져갈 주소. `S3_ENDPOINT` 는 컨테이너 망의 호스트명이라
      # 브라우저가 도달하지 못한다 — 폴백에 맡기면 아바타만 깨진다.
      S3_PUBLIC_BASE_URL: http://localhost:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: workflow-storage
      # macOS Docker Desktop 의 bind-mount 는 inotify 가 100% 신뢰되지 않아 폴링 활성화.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
    ports:
      - "3011:3011"
    volumes:
      - ./codebase/backend:/app/codebase/backend
      - backend_node_modules:/app/codebase/backend/node_modules
      - backend_dist:/app/codebase/backend/dist
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  frontend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: codebase/frontend/Dockerfile
      target: deps
    working_dir: /app/codebase/frontend
    # package.json 의 `dev` 는 `source .env 2>/dev/null; next dev …` 형태이므로
    # 컨테이너에 주입할 값은 host codebase/frontend/.env 에 직접 작성한다.
    # (compose `environment:` 로 줘도 `source` 가 덮어쓸 수 있음 — 폴링 변수만 예외적으로 둠)
    command: ["pnpm", "run", "dev"]
    env_file:
      - ./codebase/frontend/.env
    environment:
      WATCHPACK_POLLING: "true"
    ports:
      - "3012:3012"
    volumes:
      - ./codebase/frontend:/app/codebase/frontend
      - frontend_node_modules:/app/codebase/frontend/node_modules
      - frontend_next:/app/codebase/frontend/.next
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backend_node_modules:
  backend_dist:
  frontend_node_modules:
  frontend_next:
