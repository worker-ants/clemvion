apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: clemvion
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: clemvion
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clemvion
        app.kubernetes.io/component: backend
    spec:
      # 안전 종료 유예 시간과 맞춘다: ceil(SIGTERM_GRACE_MS / 1000) + 5. 5초는 readiness drain 여유다.
      # SIGTERM 을 받은 백엔드는 진행 중 실행을 SIGTERM_GRACE_MS(configmap.yaml) 동안 기다린 뒤 남은 것을
      # SERVER_INTERRUPTED 로 마감한다. 이 값이 그보다 짧으면 마감 전에 SIGKILL 을 받는다.
      # 두 값은 함께 바꾼다(k8s/README.md 「안전 종료 유예 시간」). .claude/tests/test_k8s_termination_grace_parity.py 가 대조한다.
      # (spec CLE-EXEC-RECOVERY 「환경 변수」)
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: clemvion/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3011
              protocol: TCP
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          readinessProbe:
            # readiness 는 의존성(DB/Redis)을 점검 — 비정상 시 HTTP 503 →
            # Pod 가 Service endpoint 에서 제외되고, 복구 시 200 으로 자동 재투입.
            # (spec/data-flow/9-observability.md §1.1)
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            # liveness 는 프로세스 생존만 확인 (의존성 미점검) — DB/Redis 장애가
            # Pod 재시작 크래시루프로 번지지 않도록 readiness(/api/health)와 분리.
            # (spec/data-flow/9-observability.md §1.1)
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
