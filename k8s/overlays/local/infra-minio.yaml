apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    app.kubernetes.io/component: minio
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  labels:
    app.kubernetes.io/component: minio
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/component: minio
    spec:
      containers:
        - name: minio
          # `pgsty/silo` — MinIO 서버의 커뮤니티 포크. MinIO 공식 이미지는 Docker Hub(2026-09-12)
          # · quay.io(2026-09-24) 모두 익명 pull 이 막혔다. 두 compose 파일과 **같은 이미지**
          # (RELEASE 태그 + 다이제스트, W-59)로 고정한다 — 근거는 docker-compose.yml 의 minio 주석.
          image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: S3_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: S3_SECRET_KEY
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
# 최초 1회 버킷 생성
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  labels:
    app.kubernetes.io/component: minio
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/component: minio
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          # 서버와 같은 이미지 — `mc` 는 이미지 안 `mcli` 의 심볼릭 링크다.
          image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          command: ["sh", "-c"]
          args:
            - |
              until mc alias set local http://minio:9000 "$S3_ACCESS_KEY" "$S3_SECRET_KEY"; do
                echo "waiting for minio..."; sleep 2;
              done
              mc mb --ignore-existing local/"$S3_BUCKET"
